<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YETIPSY — Cart 购物车</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=2.1.13">
</head>
<body>

<div class="page page-with-cta">

  <div class="row-between" style="padding: 6px 2px 12px;">
    <a href="menu.html" style="color:var(--muted)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="brand-mark" style="font-size:17px;letter-spacing:5px;text-indent:5px;">YETIPSY</div>
    <div style="width:20px"></div>
  </div>

  <div class="bilingual-zh" style="font-size:20px">你的订单</div>
  <div class="bilingual-en">YOUR ORDER</div>

  <div id="cartList" class="mt-12"></div>

</div>

<div class="sticky-cta" id="stickyCta" style="display:none">
  <button class="btn btn-primary" id="checkoutBtn" disabled><span>CHECKOUT</span></button>
</div>

<!-- ================= 结帐大抽屉（不用换页） ================= -->
<div class="sheet" id="checkoutSheet" style="display:none">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-label="结帐 CHECKOUT">
    <div class="sheet-head">
      <div class="sheet-titles">
        <div class="bilingual-zh" style="font-size:17px">确认订单</div>
        <div class="bilingual-en">CONFIRM ORDER</div>
        <div class="tiny" style="color:var(--gold);margin-top:3px" id="sheetSubtitle"></div>
      </div>
      <button class="sheet-close" id="sheetCloseBtn" aria-label="关闭 CLOSE">✕</button>
    </div>
    <div class="sheet-body" id="checkoutBody"></div>
    <div class="sheet-foot" id="sheetCta">
      <button class="btn btn-primary" id="placeOrderBtn" disabled><span>PLACE ORDER</span></button>
    </div>
  </div>
</div>

<script src="js/config.js?v=2.1.13"></script>
<script src="js/api.js?v=2.1.13"></script>
<script src="js/auth.js?v=2.1.13"></script>
<script src="js/ui.js?v=2.1.13"></script>
<script src="js/cart.js?v=2.1.13"></script>
<script src="js/checkout.js?v=2.1.13"></script>
<script src="js/cart-page.js?v=2.1.13"></script>
<script>
  CARTPAGE.init();
  CHECKOUT.initSheet();      /* 大抽屉：先预载报价，按结帐立刻打开 */
</script>

<script>
/* PWA：註冊 Service Worker（只 Cache App Shell，不 Cache 任何敏感资料） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
