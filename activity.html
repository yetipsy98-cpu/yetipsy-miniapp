<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YETIPSY — Activity</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="page">

  <div class="row-between" style="padding: 6px 2px 14px;">
    <a href="index.html" style="color:var(--muted)">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="brand-mark" style="font-size:17px;letter-spacing:5px;text-indent:5px;">YETIPSY</div>
    <div style="width:20px"></div>
  </div>

  <div class="section-title">
    <span class="st-zh">我的记录</span><span class="st-en">MY ACTIVITY</span>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="orders">消费 VISITS</button>
    <button class="tab" data-tab="points">积分 POINTS</button>
    <button class="tab" data-tab="wallet">钱包 WALLET</button>
  </div>

  <div id="listBox" class="mt-12">
    <div class="skeleton" style="height:64px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:64px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:64px"></div>
  </div>

  <div class="footnote">YETIPSY MINI APP 2.1.6 · FOODCOURT POS EDITION</div>
</div>

<style>
.tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 4px; }
.tab {
  flex: 1; min-height: 38px; border: none; background: transparent; color: var(--muted);
  border-radius: 10px; font-size: 10.5px; letter-spacing: .8px; cursor: pointer;
}
.tab.active { background: var(--card-2); color: var(--gold); font-weight: 600; }
</style>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/activity.js"></script>
<script>
  ACTIVITY.init();
</script>

<script>
/* PWA：註冊 Service Worker（只 Cache App Shell，不 Cache 任何敏感资料） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
