<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>YETIPSY STAFF — Create Claim</title>
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/app.css?v=2.1.10">
<link rel="stylesheet" href="../css/admin.css?v=2.1.10">
</head>
<body class="admin">

<div class="a-page">

  <!-- ========== FORM ========== -->
  <div id="viewForm">

    <div class="a-field">
      <label class="a-label">Source 来源</label>
      <div class="seg" id="sourceSeg">
        <button class="active" data-source="FOODCOURT">FOODCOURT<br><span class="tiny">食阁</span></button>
        <button data-source="DIRECT">DIRECT<br><span class="tiny">直接</span></button>
        <button data-source="MANUAL">MANUAL<br><span class="tiny">手动</span></button>
      </div>
    </div>

    <div class="a-field">
      <label class="a-label">Order No. 订单号码</label>
      <input id="orderNoInput" class="a-input" type="text" autocomplete="off"
             autocapitalize="characters" placeholder="FC8231" maxlength="30">
      <div class="a-note mt-8" id="orderNoHint">输入 Foodcourt 订单号码 · Enter the Foodcourt order number</div>
    </div>

    <div class="a-field">
      <label class="a-label">Amount 金额</label>
      <div class="amount-wrap">
        <span class="currency">RM</span>
        <input id="amountInput" class="a-input huge" type="text" inputmode="decimal"
               autocomplete="off" placeholder="0.00">
      </div>
    </div>

    <button id="createBtn" class="btn btn-primary" style="min-height:54px">
      CREATE CLAIM 建立认领
    </button>
  </div>

  <!-- ========== RESULT ========== -->
  <div id="viewResult" style="display:none">

    <div class="card center" style="border-color:rgba(229,183,105,.35);background:linear-gradient(180deg,#1E1B15,#151412)">
      <div class="tiny muted-2" style="letter-spacing:2.4px">CLAIM READY</div>
      <div style="font-size:38px;font-weight:750;color:var(--a-gold);margin-top:8px" id="resAmount">RM 0.00</div>
      <div class="a-sub mt-8" id="resOrder">—</div>

      <div class="qr-box mt-16">
        <div id="qrContainer"></div>
      </div>

      <div class="center mt-12">
        <div class="tiny muted-2" style="letter-spacing:2px">SCAN TO CLAIM</div>
        <div class="tiny muted-2" style="letter-spacing:1.6px;margin-top:6px">or 或</div>
        <div style="font-size:34px;font-weight:750;letter-spacing:8px;margin-top:6px;color:var(--a-gold)" id="resCode">Y7K2</div>
        <div class="tiny muted-2" style="margin-top:6px">CODE</div>
      </div>

      <div class="tiny muted-2 mt-12" id="resExpiry">—</div>
    </div>

    <div class="btn-row mt-12">
      <button id="copyBtn" class="btn btn-secondary btn-sm">COPY CODE</button>
      <button id="cancelBtn" class="btn btn-danger btn-sm">CANCEL</button>
    </div>

    <button id="newClaimBtn" class="btn btn-primary mt-8">
      + NEW CLAIM 下一笔
    </button>

    <div class="a-note center mt-12">
      把 QR 或 Code 给顾客 · 顾客回家后仍可认领<br>
      Give the QR or code to the customer.
    </div>
  </div>

  <!-- ========== RECENT ========== -->
  <div class="a-section-title">Recent Claims 最近建立</div>
  <div id="recentList"><div class="a-empty">Loading…</div></div>

</div>

<script src="../js/config.js?v=2.1.10"></script>
<script src="../js/api.js?v=2.1.10"></script>
<script src="../js/auth.js?v=2.1.10"></script>
<script src="../js/ui.js?v=2.1.10"></script>
<script src="../js/vendor/qrcode.js?v=2.1.10"></script>
<script src="../js/admin.js?v=2.1.10"></script>
<script src="../js/admin-claim.js?v=2.1.10"></script>
<script>
  if (ADMIN.requireAuth()) {
    ADMIN.renderShell({ title: 'CREATE CLAIM' });
    ADMIN_CLAIM.init();
  }
</script>
</body>
</html>
