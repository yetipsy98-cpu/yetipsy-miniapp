<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>YETIPSY STAFF — 菜单管理</title>
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/app.css?v=2.1.14">
<link rel="stylesheet" href="../css/admin.css?v=2.1.14">
<style>
.menu-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0 12px; }
.menu-bar .a-input { flex: 1 1 160px; }
#productForm {
  display: none; border: 1px solid var(--a-gold); border-radius: 14px;
  padding: 14px; margin-bottom: 16px;
}
.a-list { display: flex; align-items: flex-start; gap: 10px; padding: 12px 0;
  border-bottom: 1px solid var(--a-line); }
.a-list .a-right { display: flex; flex-direction: column; gap: 6px; flex: 0 0 auto; }
.a-list .a-right .chip { white-space: nowrap; }
.mt-8 { margin-top: 8px; }
.chip-warn { border-color: #E2696B; color: #E2696B; }
.cat-strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; }
.cat-chip { border: 1px solid var(--a-line); border-radius: 999px; padding: 4px 12px;
  font-size: 11px; letter-spacing: 1px; cursor: pointer; white-space: nowrap; }
.cat-chip.active { border-color: var(--a-gold); color: var(--a-gold); }
</style>
</head>
<body class="admin">

<div class="a-page">

  <div class="menu-bar">
    <input class="a-input" id="menuSearch" placeholder="搜寻商品… Search products">
    <button class="chip" id="addCategoryBtn">+ 分类</button>
    <button class="chip chip-on" id="addProductBtn">+ 商品 PRODUCT</button>
  </div>

  <div class="cat-strip" id="catFilter"></div>

  <div id="productForm"></div>

  <div id="menuAdminBody"></div>

</div>

<script src="../js/config.js?v=2.1.14"></script>
<script src="../js/api.js?v=2.1.14"></script>
<script src="../js/auth.js?v=2.1.14"></script>
<script src="../js/ui.js?v=2.1.14"></script>
<script src="../js/admin.js?v=2.1.14"></script>
<script src="../js/admin-menu.js?v=2.1.14"></script>
<script>
  if (ADMIN.requireAuth()) {
    ADMIN.renderShell({ title: 'MENU' });
    ADMIN_MENU.init();
    document.getElementById('addCategoryBtn').addEventListener('click', ADMIN_MENU.addCategory);
  }
</script>
</body>
</html>
