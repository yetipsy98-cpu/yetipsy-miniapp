<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>YETIPSY STAFF — 扫码抵扣</title>
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/app.css?v=2.1.17">
<link rel="stylesheet" href="../css/admin.css?v=2.1.17">
<style>
.scan-box {
  position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000;
  border-radius: 14px; overflow: hidden; border: 1px solid var(--a-line);
}
.scan-box video { width: 100%; height: 100%; object-fit: cover; display: block; }
.scan-line {
  position: absolute; left: 8%; right: 8%; height: 2px; top: 50%;
  background: var(--a-gold); box-shadow: 0 0 12px rgba(229,183,105,.8);
  animation: scanmove 2.2s ease-in-out infinite;
}
@keyframes scanmove { 0%,100% { top: 22%; } 50% { top: 78%; } }
.scan-hint {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 8px;
  background: rgba(0,0,0,.6); color: #F4F1EA; font-size: 10.5px;
  letter-spacing: 1.2px; text-align: center;
}
.verify-card { border: 1px solid var(--a-gold); border-radius: 14px; padding: 14px; }
.v-row { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; }
.v-row span:last-child { color: var(--a-gold); font-weight: 600; }
.v-count { font-size: 10.5px; letter-spacing: 1.4px; color: var(--a-muted); margin-top: 8px; }
.calc-line { font-size: 12px; color: var(--a-muted); margin-top: 6px; }
</style>
</head>
<body class="admin">

<div class="a-page">

  <!-- ========== STEP 1 · 扫描 ========== -->
  <div id="stepScan">
    <div class="a-section-title">① 扫描顾客的会员条码 SCAN MEMBER CODE</div>

    <div class="scan-box" id="scanBox" style="display:none">
      <video id="scanVideo" playsinline muted autoplay></video>
      <div class="scan-line"></div>
      <div class="scan-hint" id="scanHint">把顾客的条码对准框内</div>
    </div>

    <div class="btn-row mt-8">
      <button id="startScanBtn" class="btn btn-primary">开始扫描 SCAN</button>
      <button id="stopScanBtn" class="btn btn-secondary" style="display:none">停止 STOP</button>
    </div>

    <div class="a-note mt-8" id="scanSupport">检查这台装置的扫描能力…</div>

    <div class="a-section-title mt-16">扫不到？手动输入 ENTER MANUALLY</div>
    <input id="manualInput" class="a-input" type="text" autocomplete="off"
           placeholder="YT1|YT000001|…" spellcheck="false">
    <button id="manualBtn" class="btn btn-secondary btn-sm mt-8">验证 VERIFY</button>
  </div>

  <!-- ========== STEP 2 · 确认顾客 ========== -->
  <div id="stepVerify" style="display:none">
    <div class="a-section-title">② 确认是这位顾客 CONFIRM CUSTOMER</div>

    <div class="verify-card">
      <div style="font-size:20px;font-weight:700" id="vName">—</div>
      <div class="a-sub" id="vId">—</div>
      <div class="mt-8">
        <div class="v-row"><span>等级 TIER</span><span id="vTier">—</span></div>
        <div class="v-row"><span>积分 POINTS</span><span id="vPoints">—</span></div>
        <div class="v-row"><span>钱包 WALLET</span><span id="vWallet">—</span></div>
        <div class="v-row"><span>电话 PHONE</span><span id="vPhone">—</span></div>
      </div>
      <div class="v-count" id="vCount">—</div>
    </div>

    <div class="btn-row mt-8">
      <button id="rescanBtn" class="btn btn-secondary btn-sm">重扫 RESCAN</button>
    </div>
  </div>

  <!-- ========== STEP 3 · 抵扣 ========== -->
  <div id="stepRedeem" style="display:none">
    <div class="a-section-title">③ 抵扣钱包 REDEEM WALLET</div>

    <div class="a-label">账单总额 BILL TOTAL (RM)</div>
    <input id="billInput" class="a-input huge" type="text" inputmode="decimal"
           placeholder="0.00" autocomplete="off">

    <button id="calcBtn" class="btn btn-secondary btn-sm mt-8">计算可抵扣 CALCULATE</button>
    <div class="calc-line" id="calcLine"></div>

    <div class="a-label mt-16">要用钱包抵扣多少 WALLET TO USE (RM)</div>
    <input id="walletInput" class="a-input" type="text" inputmode="decimal"
           placeholder="0.00" autocomplete="off">

    <button id="redeemBtn" class="btn btn-primary mt-16" style="min-height:54px">
      确认抵扣 CONFIRM REDEMPTION
    </button>

    <div class="a-note mt-8">
      抵扣会建立消费记录、扣钱包、发积分，并写入 Audit Log。
    </div>
  </div>

  <!-- ========== 结果 ========== -->
  <div id="stepResult" style="display:none">
    <div class="a-card center" style="padding:24px 16px">
      <div style="font-size:44px">✅</div>
      <div class="a-section-title mt-8">抵扣完成 REDEEMED</div>
      <div style="font-size:30px;font-weight:750;color:var(--a-gold);margin-top:6px" id="rUsed">RM 0.00</div>
      <div class="a-sub mt-8" id="rDetail">—</div>
      <button id="againBtn" class="btn btn-primary mt-16">下一位顾客 NEXT</button>
    </div>
  </div>

</div>

<script src="../js/config.js?v=2.1.17"></script>
<script src="../js/api.js?v=2.1.17"></script>
<script src="../js/auth.js?v=2.1.17"></script>
<script src="../js/ui.js?v=2.1.17"></script>
<script src="../js/vendor/jsQR.js?v=2.1.17"></script>
<script src="../js/admin.js?v=2.1.17"></script>
<script src="../js/scanner.js?v=2.1.17"></script>
<script src="../js/admin-redeem.js?v=2.1.17"></script>
<script>
  if (ADMIN.requireAuth()) {
    ADMIN.renderShell({ title: 'SCAN & REDEEM' });
    ADMIN_REDEEM.init();
  }
</script>
</body>
</html>
