<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>YETIPSY STAFF</title>
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin">

<div class="login-wrap">
  <div class="login-logo">
    <div class="ll-mark">YETIPSY</div>
    <div class="ll-sub">staff · admin</div>
  </div>

  <div style="height: 34px"></div>

  <div id="demoBanner"></div>

  <div class="a-field">
    <label class="a-label">Username 账号</label>
    <input id="usernameInput" class="a-input" type="text" autocomplete="username"
           autocapitalize="none" spellcheck="false" placeholder="owner">
  </div>

  <div class="a-field">
    <label class="a-label">Password 密码</label>
    <input id="passwordInput" class="a-input" type="password" autocomplete="current-password" placeholder="••••••••">
  </div>

  <button id="loginBtn" class="btn btn-primary" style="min-height:52px">
    SIGN IN 登录
  </button>

  <div class="center mt-16">
    <a href="../index.html" class="tiny muted-2">BACK TO CUSTOMER APP 返回会员端</a>
  </div>

  <div class="footnote">YETIPSY MINI APP 1.1 · FOODCOURT EDITION</div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/admin.js"></script>
<script>
(function () {
  var btn = document.getElementById('loginBtn');
  var u   = document.getElementById('usernameInput');
  var p   = document.getElementById('passwordInput');

  if (YETIPSY_CONFIG.IS_MISCONFIGURED && YETIPSY_CONFIG.IS_MISCONFIGURED()) {
    document.getElementById('demoBanner').innerHTML =
      '<div class="demo-banner" style="border-color:#E2696B;color:#E2696B">' +
      'BACKEND NOT CONFIGURED · 未配置后端<br>' +
      '<span class="tiny">请在 js/config.js 填入 API_URL（Google Apps Script Web App URL）。</span></div>';
  } else if (YETIPSY_CONFIG.IS_DEMO()) {
    document.getElementById('demoBanner').innerHTML =
      '<div class="demo-banner">DEMO MODE · owner / manager / staff<br>password: yetipsy123</div>';
  }

  if (AUTH.isStaffLoggedIn()) {
    API.staff.getSession().then(function (res) {
      if (res.success) location.replace('index.html');
      else { AUTH.clearStaff(); }
    });
  }

  function submit() {
    var username = u.value.trim();
    var password = p.value;
    if (!username || !password) {
      UI.toast('Enter username and password / 请输入账号密码', 'error');
      return;
    }
    UI.setLoading(btn, true, 'SIGNING IN');
    API.staff.login(username, password).then(function (res) {
      UI.setLoading(btn, false);
      if (!res.success) {
        UI.toast(res.error.message, 'error');
        return;
      }
      AUTH.setStaffSession(res.data.token, res.data.staff);
      location.replace('index.html');
    });
  }

  btn.addEventListener('click', submit);
  p.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
  u.addEventListener('keydown', function (e) { if (e.key === 'Enter') p.focus(); });
  u.focus();
})();
</script>
</body>
</html>
