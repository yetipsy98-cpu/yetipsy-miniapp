<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0B">
<title>YETIPSY STAFF — 扫码进分</title>
<link rel="icon" type="image/png" href="../assets/icons/icon-192.png">
<link rel="stylesheet" href="../css/app.css">
<link rel="stylesheet" href="../css/admin.css">
<style>
.scan-box { position: relative; border: 1px solid var(--a-line); border-radius: 14px;
  overflow: hidden; background: #000; }
.scan-box video { width: 100%; display: block; }
.scan-frame { position: absolute; left: 12%; right: 12%; top: 22%; bottom: 22%;
  border: 2px solid var(--a-gold); border-radius: 12px; pointer-events: none; }
.g-row { display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; }
.g-row:last-child { border-bottom: 0; }
.g-k { color: var(--a-muted); letter-spacing: .8px; font-size: 11px; }
.g-v { font-weight: 700; }
.g-big { font-size: 30px; font-weight: 800; color: var(--a-gold); letter-spacing: 1px; }
</style>
</head>
<body class="admin">

<div class="a-page">

  <!-- ① 扫会员条码 -->
  <div id="stepScan">
    <div class="a-section-title">① 扫会员条码 SCAN MEMBER CODE</div>
    <div class="a-sub">顾客点完单后，扫他的会员码确认身分</div>

    <div class="scan-box" id="scanBox" style="display:none;margin-top:12px">
      <video id="scanVideo" muted playsinline></video>
      <div class="scan-frame"></div>
    </div>

    <div class="a-sub mt-12" id="scanHint"></div>
    <div class="a-sub mt-8" id="scanSupport"></div>

    <button class="btn btn-primary mt-16" id="startScanBtn" style="width:100%">
      开启相机 START CAMERA</button>
    <button class="btn btn-ghost mt-8" id="stopScanBtn" style="width:100%;display:none">
      停止 STOP</button>

    <div class="a-divider"></div>
    <div class="a-sub">没有相机？请顾客报出条码内容</div>
    <div class="row-between mt-8" style="gap:8px">
      <input class="a-input" id="manualInput" placeholder="YT1|YT000001|…"
        style="flex:1 1 auto">
      <button class="btn btn-secondary" id="manualBtn" style="width:auto;padding:0 16px">
        输入</button>
    </div>
  </div>

  <!-- ② 确认会员 + 输金额 -->
  <div id="stepVerify" style="display:none">
    <div class="a-section-title">② 确认会员 · 输消费金额</div>

    <div class="cust-card">
      <div class="a-title" id="vName">—</div>
      <div class="a-sub"><span id="vId">—</span> · <span id="vPhone">—</span></div>
      <div class="mt-8">
        <div class="g-row"><span class="g-k">等级 TIER</span><span class="g-v" id="vTier">—</span></div>
        <div class="g-row"><span class="g-k">现有积分 POINTS</span><span class="g-v" id="vPoints">—</span></div>
        <div class="g-row"><span class="g-k">钱包 WALLET</span><span class="g-v" id="vWallet">—</span></div>
        <div class="g-row"><span class="g-k">到店 VISITS</span><span class="g-v" id="vCount">—</span></div>
      </div>
      <div class="a-sub mt-8" id="vLeft">—</div>
    </div>

    <div class="a-field mt-16">
      <label class="a-label">消费金额（RM） BILL AMOUNT</label>
      <input class="a-input" id="billInput" type="number" step="0.01" min="0"
        placeholder="86.00" inputmode="decimal" style="font-size:22px">
    </div>

    <div class="a-sub" id="calcLine"></div>
    <button class="btn btn-secondary mt-8" id="calcBtn" style="width:100%">
      计算 CALCULATE</button>

    <div class="a-field mt-16">
      <label class="a-label">单号（选填）EXTERNAL ORDER ID</label>
      <input class="a-input" id="extInput" placeholder="FC8231">
      <div class="a-sub mt-8">填了就不会重复登记同一个单号</div>
    </div>

    <div class="a-field mt-16">
      <label class="a-label">备注（选填）NOTE</label>
      <input class="a-input" id="noteInput" placeholder="4 号桌">
    </div>

    <button class="btn btn-primary mt-16 big-action" id="grantBtn" style="width:100%;display:none">
      确认进分 CONFIRM</button>
    <button class="btn btn-ghost mt-8" id="rescanBtn" style="width:100%">
      重新扫码 RESCAN</button>
  </div>

  <!-- ③ 结果 -->
  <div id="stepResult" style="display:none">
    <div class="a-section-title">✓ 已登记 DONE</div>

    <div class="cust-card" style="text-align:center">
      <div class="a-title" id="rName">—</div>
      <div class="g-big mt-8" id="rPoints">+0 分</div>
      <div class="a-sub" id="rReward"></div>
    </div>

    <div class="panel mt-16" style="border:1px solid var(--a-line);border-radius:14px;padding:12px">
      <div class="g-row"><span class="g-k">消费 BILL</span><span class="g-v" id="rBill">—</span></div>
      <div class="g-row"><span class="g-k">到店 VISIT</span><span class="g-v" id="rVisit">—</span></div>
      <div class="g-row"><span class="g-k">积分总计 TOTAL POINTS</span><span class="g-v" id="rTotal">—</span></div>
      <div class="g-row"><span class="g-k">累计消费 TOTAL SPEND</span><span class="g-v" id="rSpend">—</span></div>
    </div>

    <div class="a-sub mt-12">积分按 POINTS_PER_RM 自动计算；Reward 达门槛自动发出。
      六小时内的重复消费不会重复计到店次数。</div>

    <button class="btn btn-primary mt-16" id="againBtn" style="width:100%">
      再来一单 NEXT</button>
  </div>

</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/scanner.js"></script>
<script src="../js/vendor/jsQR.js"></script>
<script src="../js/admin-grant.js"></script>
<script>
  if (ADMIN.requireAuth()) {
    ADMIN.renderShell({ title: 'SCAN & GRANT' });
    ADMIN_GRANT.init();
  }
</script>
</body>
</html>
