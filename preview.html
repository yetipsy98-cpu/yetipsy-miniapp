<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YETIPSY — 单档离线预览 OFFLINE PREVIEW</title>
<style>
/* =============================================================
   YETIPSY MINI APP 1.1 — app.css
   Customer App Theme
   -------------------------------------------------------------
   Brand direction: Chill · Modern · Premium · Young · Cocktail
   Minimal · Nightlife
   Base:  #0D0D0D background  /  #171717 card
          #F4F1EA text        /  #A7A7A7 secondary
   ============================================================= */

:root {
  --bg:          #0D0D0D;
  --bg-soft:     #131313;
  --card:        #171717;
  --card-2:      #1E1E1E;
  --line:        #262626;
  --line-soft:   #1F1F1F;
  --text:        #F4F1EA;
  --muted:       #A7A7A7;
  --muted-2:     #6E6E6E;
  --gold:        #E5B769;
  --gold-soft:   rgba(229, 183, 105, 0.14);
  --gold-line:   rgba(229, 183, 105, 0.34);
  --ok:          #58B58C;
  --danger:      #E2696B;
  --radius:      16px;
  --radius-sm:   12px;
  --shadow:      0 8px 30px rgba(0,0,0,0.45);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-h:       64px;
  --header-h:    58px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior-y: none;
}

body {
  min-height: 100vh;
  max-width: 520px;
  margin: 0 auto;
  position: relative;
  background:
    radial-gradient(900px 420px at 50% -12%, rgba(229,183,105,0.09), transparent 62%),
    var(--bg);
}

body.has-header { padding-top: var(--header-h); }
body.has-bottom-nav { padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px); }

a { color: inherit; text-decoration: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }

/* ============================================================
   HEADER
   ============================================================ */
.app-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 60;
  background: rgba(13,13,13,0.86);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.header-inner {
  max-width: 520px;
  margin: 0 auto;
  height: var(--header-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
}
.header-back, .header-back-spacer {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  flex: 0 0 34px;
}
.header-back:active { opacity: .6; }
.header-title { flex: 1; text-align: center; }
.ht-zh { font-size: 15px; font-weight: 600; letter-spacing: .5px; }
.ht-en { font-size: 9px; letter-spacing: 2px; color: var(--muted-2); text-transform: uppercase; }
.header-right { min-width: 34px; display: flex; justify-content: flex-end; }

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 60;
  display: flex;
  background: rgba(16,16,16,0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
  padding-bottom: var(--safe-bottom);
}
.bottom-nav-inner, .bottom-nav { max-width: 520px; margin: 0 auto; }
.nav-item {
  flex: 1;
  height: var(--nav-h);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: var(--muted-2);
  transition: color .18s ease;
}
.nav-item.active { color: var(--gold); }
.nav-zh { font-size: 10px; letter-spacing: .5px; }
.nav-en { font-size: 7.5px; letter-spacing: 1.2px; opacity: .7; }

/* ============================================================
   LAYOUT
   ============================================================ */
.page { padding: 16px 16px 24px; }
.section { margin-bottom: 20px; }
.section-title {
  display: flex; align-items: baseline; gap: 8px;
  margin: 0 2px 10px;
}
.section-title .st-zh { font-size: 13px; font-weight: 600; letter-spacing: .5px; }
.section-title .st-en { font-size: 9px; letter-spacing: 1.6px; color: var(--muted-2); text-transform: uppercase; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
}
.card.tight { padding: 13px 14px; }
.card.gold {
  border-color: var(--gold-line);
  background: linear-gradient(180deg, rgba(229,183,105,0.08), rgba(229,183,105,0.02));
}

/* ============================================================
   BRAND / HERO
   ============================================================ */
.brand {
  text-align: center;
  padding: 30px 0 8px;
}
.brand-mark {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 9px;
  text-indent: 9px;
  background: linear-gradient(180deg, #F7ECD2, var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-tag {
  font-size: 10.5px;
  letter-spacing: 3.2px;
  color: var(--muted-2);
  text-transform: uppercase;
  margin-top: 6px;
}

/* Membership hero card */
.hero-card {
  position: relative;
  overflow: hidden;
  border-radius: 20px;
  border: 1px solid var(--line);
  background:
    radial-gradient(120% 90% at 88% 0%, rgba(229,183,105,0.16), transparent 58%),
    linear-gradient(160deg, #1C1C1C, #131313);
  padding: 18px;
  margin-bottom: 14px;
}
.hero-top { display: flex; align-items: center; justify-content: space-between; }
.hero-greet { font-size: 13px; color: var(--muted); }
.hero-greet b { color: var(--text); font-weight: 600; }
.hero-points { margin-top: 14px; display: flex; align-items: flex-end; gap: 10px; }
.hero-points-value {
  font-size: 38px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.5px;
  color: var(--gold);
}
.hero-points-unit { font-size: 10px; letter-spacing: 2px; color: var(--muted-2); padding-bottom: 5px; }

.tier {
  display: inline-block;
  font-size: 9.5px;
  letter-spacing: 1.6px;
  padding: 4px 9px;
  border-radius: 999px;
  border: 1px solid currentColor;
  font-weight: 600;
}
.tier-member { color: #A7A7A7; }
.tier-silver { color: #C9CFD6; }
.tier-gold   { color: var(--gold); background: var(--gold-soft); }

/* progress */
.progress-wrap { margin-top: 16px; }
.progress-meta {
  display: flex; justify-content: space-between;
  font-size: 10.5px; color: var(--muted-2);
  margin-bottom: 6px; letter-spacing: .6px;
}
.progress-track {
  height: 5px; border-radius: 999px;
  background: #262626; overflow: hidden;
}
.progress-bar {
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, #B98F45, var(--gold));
  transition: width .8s cubic-bezier(.2,.8,.2,1);
}

/* ============================================================
   STAT GRID
   ============================================================ */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.stat {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 13px 14px;
}
.stat-label {
  font-size: 9px; letter-spacing: 1.6px; color: var(--muted-2);
  text-transform: uppercase; margin-bottom: 6px;
}
.stat-value { font-size: 19px; font-weight: 650; letter-spacing: -.2px; }
.stat-value.gold { color: var(--gold); }
.stat-sub { font-size: 10px; color: var(--muted-2); margin-top: 3px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  width: 100%;
  min-height: 50px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid transparent;
  background: var(--card-2);
  color: var(--text);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1px;
  cursor: pointer;
  transition: transform .12s ease, opacity .15s ease, background .2s ease;
}
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(180deg, #F0C87E, var(--gold));
  color: #17130A;
  box-shadow: 0 6px 22px rgba(229,183,105,0.18);
}
.btn-secondary { background: var(--card-2); border-color: var(--line); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--muted); }
.btn-danger { background: transparent; border-color: rgba(226,105,107,.5); color: var(--danger); }
.btn-sm { min-height: 40px; font-size: 12.5px; border-radius: 11px; }
.btn-row { display: flex; gap: 10px; }
.btn-sub-label { font-size: 9px; letter-spacing: 1.4px; opacity: .72; display: block; }

.btn-spinner {
  width: 15px; height: 15px;
  border: 2px solid rgba(0,0,0,.25);
  border-top-color: rgba(0,0,0,.65);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}
.btn-ghost .btn-spinner, .btn-secondary .btn-spinner, .btn-danger .btn-spinner {
  border-color: rgba(255,255,255,.2); border-top-color: rgba(255,255,255,.75);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Big CTA (claim) */
.cta-claim {
  display: block;
  width: 100%;
  border-radius: 18px;
  padding: 18px;
  border: 1px solid var(--gold-line);
  background:
    radial-gradient(90% 120% at 100% 0%, rgba(229,183,105,.18), transparent 60%),
    linear-gradient(180deg, #1D1B16, #161513);
  text-align: left;
  cursor: pointer;
  color: var(--text);
}
.cta-claim:active { transform: scale(.99); }
.cta-claim .cta-main { font-size: 16px; font-weight: 650; }
.cta-claim .cta-sub { font-size: 9.5px; letter-spacing: 1.8px; color: var(--muted-2); margin-top: 3px; }
.cta-claim .cta-row { display: flex; align-items: center; justify-content: space-between; }

/* Quick grid */
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 4px 10px;
  text-align: center;
  color: var(--text);
}
.quick-item:active { transform: scale(.97); }
.quick-item .qi-icon { color: var(--gold); display:block; margin-bottom: 6px; }
.quick-item .qi-zh { font-size: 11px; display: block; }
.quick-item .qi-en { font-size: 7.5px; letter-spacing: 1px; color: var(--muted-2); display: block; margin-top: 2px; }

/* ============================================================
   FORMS
   ============================================================ */
.field { margin-bottom: 14px; }
.label {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 11px; color: var(--muted); margin-bottom: 7px;
}
.label .l-en { font-size: 8.5px; letter-spacing: 1.4px; color: var(--muted-2); text-transform: uppercase; }

.input, .select, .textarea {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 14px;
  color: var(--text);
  outline: none;
  transition: border-color .18s ease, background .18s ease;
}
.input:focus, .select:focus, .textarea:focus { border-color: var(--gold-line); background: #1A1A1A; }
.input::placeholder { color: var(--muted-2); }
.input.big { font-size: 22px; letter-spacing: 2px; font-weight: 600; }
.textarea { min-height: 84px; resize: vertical; }

.phone-row {
  display: flex; align-items: stretch; gap: 8px;
}
.phone-prefix {
  display: flex; align-items: center;
  padding: 0 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 13px;
  color: var(--muted);
  font-weight: 600;
  letter-spacing: 1px;
}
.phone-row .input { flex: 1; }

/* amount input */
.amount-wrap { position: relative; }
.amount-wrap .currency {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted-2); font-weight: 600;
}
.amount-wrap .input { padding-left: 46px; font-size: 24px; font-weight: 650; letter-spacing: 1px; }

/* ============================================================
   LISTS
   ============================================================ */
.list { border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--line-soft);
}
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--card-2); }
.li-main { flex: 1; min-width: 0; }
.li-title { font-size: 14px; font-weight: 550; }
.li-sub { font-size: 10.5px; color: var(--muted-2); margin-top: 3px; letter-spacing: .4px; }
.li-right { text-align: right; }
.li-value { font-size: 14px; font-weight: 650; }
.li-value.gold { color: var(--gold); }
.li-value.ok { color: var(--ok); }
.li-value.minus { color: var(--danger); }
.li-meta { font-size: 9.5px; color: var(--muted-2); margin-top: 3px; }

/* ============================================================
   QR
   ============================================================ */
.qr-box {
  background: #fff;
  border-radius: 14px;
  padding: 14px;
  width: 232px;
  margin: 0 auto;
  box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.qr-canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
.qr-svg { display: block; }
.qr-svg svg { display: block; width: 100%; height: auto; border-radius: 4px; }
.qr-error { color: #E2696B; text-align: center; padding: 40px 0; font-size: 12px; }

/* ============================================================
   CLAIM / ORDER CARD
   ============================================================ */
.order-card { text-align: center; padding: 26px 18px; }
.oc-amount {
  font-size: 46px; font-weight: 700; letter-spacing: -1px;
  line-height: 1;
}
.oc-amount.gold { color: var(--gold); }
.oc-meta { font-size: 11.5px; color: var(--muted); margin-top: 12px; letter-spacing: .8px; }
.oc-desc { font-size: 12px; color: var(--muted-2); margin-top: 6px; }

.code-input {
  text-align: center;
  font-size: 30px;
  letter-spacing: 14px;
  text-indent: 14px;
  text-transform: uppercase;
  font-weight: 700;
}

/* ============================================================
   REWARD
   ============================================================ */
.reward-stage { text-align: center; padding: 26px 0 8px; }
.reward-envelope {
  width: 168px; height: 168px;
  margin: 0 auto 22px;
  position: relative;
  cursor: pointer;
}
.reward-envelope .env-body {
  position: absolute; inset: 0;
  border-radius: 22px;
  background:
    radial-gradient(80% 70% at 50% 12%, rgba(229,183,105,.30), transparent 62%),
    linear-gradient(180deg, #23211C, #161512);
  border: 1px solid var(--gold-line);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 8px;
  box-shadow: 0 14px 44px rgba(0,0,0,.55);
  transition: transform .25s ease;
}
.reward-envelope:active .env-body { transform: scale(.97); }
.reward-envelope.shake { animation: shake 2.4s ease-in-out infinite; }
@keyframes shake {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25%  { transform: translateY(-6px) rotate(-1.6deg); }
  50%  { transform: translateY(0) rotate(0deg); }
  75%  { transform: translateY(-5px) rotate(1.6deg); }
}
.env-mark { font-size: 44px; line-height: 1; }
.env-zh { font-size: 13px; font-weight: 600; }
.env-en { font-size: 9px; letter-spacing: 2px; color: var(--muted-2); }

.reward-open { display: none; }
.reward-open.show { display: block; animation: pop .5s cubic-bezier(.2,.9,.3,1.2); }
@keyframes pop {
  from { opacity: 0; transform: scale(.86) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.reward-amount {
  font-size: 56px; font-weight: 750; letter-spacing: -1.5px;
  color: var(--gold);
  line-height: 1;
  text-shadow: 0 0 40px rgba(229,183,105,.35);
}
.reward-note { font-size: 12px; color: var(--muted); margin-top: 12px; }

.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; overflow: hidden; }
.confetti span {
  position: absolute;
  top: -12px;
  width: 7px; height: 12px;
  opacity: .9;
  animation: fall linear forwards;
}
@keyframes fall {
  to { transform: translateY(105vh) rotate(720deg); opacity: .1; }
}

/* ============================================================
   WALLET
   ============================================================ */
.wallet-card {
  border-radius: 20px;
  padding: 22px;
  border: 1px solid var(--gold-line);
  background:
    radial-gradient(110% 100% at 100% 0%, rgba(229,183,105,.20), transparent 58%),
    linear-gradient(160deg, #1D1B17, #131211);
  text-align: center;
}
.wallet-label { font-size: 9.5px; letter-spacing: 2.4px; color: var(--muted-2); text-transform: uppercase; }
.wallet-value { font-size: 44px; font-weight: 700; letter-spacing: -1px; margin-top: 8px; color: var(--gold); }
.wallet-hint { font-size: 11px; color: var(--muted); margin-top: 10px; }

/* ============================================================
   PROMO
   ============================================================ */
.promo {
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(150deg, #1B1A17, #141413);
  padding: 16px;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.promo::after {
  content: '';
  position: absolute; right: -30px; top: -30px;
  width: 120px; height: 120px; border-radius: 50%;
  background: radial-gradient(circle, rgba(229,183,105,.14), transparent 70%);
}
.promo-title { font-size: 15px; font-weight: 650; }
.promo-sub { font-size: 10px; letter-spacing: 1.4px; color: var(--gold); margin-top: 4px; text-transform: uppercase; }
.promo-desc { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.promo-date { font-size: 9.5px; color: var(--muted-2); margin-top: 10px; letter-spacing: .6px; }

/* ============================================================
   MISC
   ============================================================ */
.bilingual-zh { font-size: 14px; font-weight: 600; }
.bilingual-en { font-size: 9px; letter-spacing: 1.6px; color: var(--muted-2); text-transform: uppercase; margin-top: 2px; }

.bi { display: inline-flex; flex-direction: column; line-height: 1.15; }
.bi b { font-weight: 600; font-size: inherit; }
.bi i {
  font-style: normal; font-size: .62em; letter-spacing: 1.5px;
  color: var(--muted-2); text-transform: uppercase; margin-top: 2px;
}
.bi-inline em { font-style: normal; color: var(--muted-2); font-size: .85em; }

.icon { display: block; }

.divider { height: 1px; background: var(--line-soft); margin: 14px 0; }

.muted { color: var(--muted); }
.muted-2 { color: var(--muted-2); }
.small { font-size: 11.5px; }
.tiny { font-size: 10px; }
.center { text-align: center; }
.mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; } .mt-24 { margin-top: 24px; }
.mb-8 { margin-bottom: 8px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.empty-state { text-align: center; padding: 46px 20px; color: var(--muted-2); }
.empty-icon { opacity: .35; margin-bottom: 12px; display: flex; justify-content: center; }
.empty-zh { font-size: 13px; color: var(--muted); }
.empty-en { font-size: 9px; letter-spacing: 1.6px; margin-top: 4px; text-transform: uppercase; }

.skeleton {
  background: linear-gradient(90deg, #191919, #212121, #191919);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 8px;
  height: 14px;
}
@keyframes shimmer { to { background-position: -200% 0; } }

/* ============================================================
   TOAST
   ============================================================ */
.toast-box {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 18px);
  z-index: 200;
  width: calc(100% - 40px);
  max-width: 420px;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
body:not(.has-bottom-nav) .toast-box { bottom: 26px; }
.toast {
  background: #26251F;
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 12.5px;
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(10px);
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast-error { border-color: rgba(226,105,107,.45); background: #2A1E1E; }
.toast-success { border-color: rgba(88,181,140,.4); background: #1C2621; }

/* ============================================================
   LOADING OVERLAY / MODAL
   ============================================================ */
.loading-overlay {
  position: fixed; inset: 0;
  background: rgba(8,8,8,.72);
  backdrop-filter: blur(4px);
  z-index: 300;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 14px;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}

<script>
/* ---- js/config.js ---- */
/* =============================================================
   YETIPSY MINI APP 1.1 — FOODCOURT EDITION
   config.js
   -------------------------------------------------------------
   这是唯一需要你手动修改的前端文件（部署时）。

   API_URL 留空  = DEMO 模式（数据存在本地 demo 服务器，用来试用/演示）
   API_URL 填入  = 连接 Google Apps Script Web App（真实环境）
   ============================================================= */

var YETIPSY_CONFIG = {

  /* ----------------------------------------------------------
     1) API 地址
     部署 Google Apps Script 之后，把 Web App URL 粘贴到这里
     例如：
     API_URL: 'https://script.google.com/macros/s/AKfycb..../exec'
     ---------------------------------------------------------- */
  API_URL: '',

  /* ----------------------------------------------------------
     2) 品牌
     ---------------------------------------------------------- */
  BAR_NAME: 'YETIPSY',
  TAGLINE: 'Join the night.',
  CURRENCY: 'RM',
  COUNTRY_CODE: '+60',
  TIMEZONE: 'Asia/Kuala_Lumpur',

  /* ----------------------------------------------------------
     3) 主题（会员端）
     ---------------------------------------------------------- */
  TIER_COLORS: {
    MEMBER: '#A7A7A7',
    SILVER: '#C9CFD6',
    GOLD:   '#E5B769'
  },

  /* ----------------------------------------------------------
     4) Session 存储 key
     ---------------------------------------------------------- */
  STORAGE: {
    CUSTOMER_TOKEN:   'yt_customer_token',
    CUSTOMER_PROFILE: 'yt_customer_profile',
    STAFF_TOKEN:      'yt_staff_token',
    STAFF_PROFILE:    'yt_staff_profile',
    LANGUAGE:         'yt_lang'
  },

  /* ----------------------------------------------------------
     5) Session 有效期（小时，仅前端提示用，后端才是权威）
     ---------------------------------------------------------- */
  CUSTOMER_SESSION_HOURS: 720,   // 30 天
  STAFF_SESSION_HOURS:     12,   // 当班

  /* ----------------------------------------------------------
     6) 二维码内容（扫描后打开的页面）
     一般不需要修改。GitHub Pages 子目录部署时才需要改。
     ---------------------------------------------------------- */
  CLAIM_PAGE: 'claim.html',

  /* ----------------------------------------------------------
     7) 调试
     ---------------------------------------------------------- */
  DEBUG: false
};

/* 是否运行在 DEMO 模式（没有填 GAS URL） */
YETIPSY_CONFIG.IS_DEMO = function () {
  return !YETIPSY_CONFIG.API_URL || YETIPSY_CONFIG.API_URL.indexOf('http') !== 0;
};

/* 实际请求地址 */
YETIPSY_CONFIG.getApiUrl = function () {
  return YETIPSY_CONFIG.IS_DEMO() ? 'api' : YETIPSY_CONFIG.API_URL;
};

/* 生成 Claim QR 内容（完整 URL）
   注意：员工端在 /admin/ 目录下，QR 必须指向根目录的 claim.html */
YETIPSY_CONFIG.buildClaimUrl = function (token) {
  var path = (typeof UI !== 'undefined') ? UI.basePath() : './';
  var origin = (typeof location !== 'undefined' && location.origin && location.origin !== 'null')
    ? location.origin : '';
  return origin + path + YETIPSY_CONFIG.CLAIM_PAGE + '?token=' + encodeURIComponent(token);
};


/* ---- js/api.js ---- */
/* =============================================================
   YETIPSY — api.js
   -------------------------------------------------------------
   前端唯一的后端通讯层。
   UI 永远不知道 Google Sheet / 栏位 / Spreadsheet ID。
   未来要换成 Supabase / PostgreSQL，只需要改这个文件。

   所有请求格式：
     POST { action: 'claimOrder', token: 'xxx', data: {} }
   所有响应格式：
     { success: true,  data: {...}, error: null }
     { success: false, data: null,  error: { code, message } }
   ============================================================= */

var API = (function () {

  var NETWORK_ERROR = {
    code: 'NETWORK_ERROR',
    message: 'Network error. Please try again. / 网络错误，请重试。'
  };

  function log() {
    if (YETIPSY_CONFIG.DEBUG) {
      console.log.apply(console, arguments);
    }
  }

  /**
   * 主请求函数
   * @param {string} action
   * @param {object} data
   * @param {object} options  { sessionType: 'customer'|'staff'|null, silent: bool }
   */
  function call(action, data, options) {
    options = options || {};
    var sessionType = options.sessionType || 'auto';

    var payload = {
      action: action,
      data: data || {}
    };

    // 自动带上 session token
    if (sessionType === 'auto') {
      payload.token = AUTH.getCustomerToken() || AUTH.getStaffToken() || '';
    } else if (sessionType === 'customer') {
      payload.token = AUTH.getCustomerToken() || '';
    } else if (sessionType === 'staff') {
      payload.token = AUTH.getStaffToken() || '';
    } else {
      payload.token = '';
    }

    log('[API]', action, payload);

    var request;

    try {
      request = fetch(YETIPSY_CONFIG.getApiUrl(), {
        method: 'POST',
        redirect: 'follow',
        // 使用 text/plain 避免 CORS 预检（Google Apps Script 需要）
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    } catch (e) {
      request = Promise.reject(e);
    }

    return request
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (text) {
        var json;
        try {
          json = JSON.parse(text);
        } catch (e) {
          log('[API] bad json:', text.slice(0, 200));
          throw new Error('BAD_JSON');
        }
        log('[API] response', action, json);
        return normalize(json);
      })
      .catch(function (err) {
        log('[API] error', action, err);

        /* ------------------------------------------------------------
           离线回退（只在 DEMO 模式 = 还没填 GAS API URL 时启用）
           没有后端时改用浏览器内的模拟后端，让 App 仍可完整操作。
           填上真实 API_URL 之后，这个回退永远不会启用。
           ------------------------------------------------------------ */
        if (YETIPSY_CONFIG.IS_DEMO() && typeof MOCK_BACKEND !== 'undefined' && MOCK_BACKEND.handleRequest) {
          try {
            return normalize(MOCK_BACKEND.handleRequest(payload));
          } catch (e2) {
            log('[API] mock error', e2);
          }
        }
        return { success: false, data: null, error: NETWORK_ERROR };
      });
  }

  /** 统一响应结构 */
  function normalize(json) {
    if (!json) return { success: false, data: null, error: NETWORK_ERROR };
    if (json.success) {
      return { success: true, data: json.data || {}, error: null };
    }
    return {
      success: false,
      data: json.data || null,
      error: json.error || { code: 'UNKNOWN', message: 'Something went wrong.' }
    };
  }

  /* --------------------------------------------------------
     便捷封装：失败自动显示 toast
     -------------------------------------------------------- */
  function callWithToast(action, data, options) {
    return call(action, data, options).then(function (res) {
      if (!res.success && !(options && options.silent)) {
        UI.toast(res.error.message || res.error.code, 'error');
      }
      return res;
    });
  }

  /* ========================================================
     CUSTOMER API
     ======================================================== */
  var customer = {
    login: function (phone, name) {
      return call('customerLogin', { phone: phone, name: name }, { sessionType: null });
    },
    logout: function () {
      return call('customerLogout', {}, { sessionType: 'customer' });
    },
    getProfile: function () {
      return call('getProfile', {}, { sessionType: 'customer' });
    },
    updateProfile: function (name, birthday) {
      return call('updateProfile', { name: name, birthday: birthday }, { sessionType: 'customer' });
    },
    getMembership: function () {
      return call('getMembership', {}, { sessionType: 'customer' });
    },
    getPoints: function () {
      return call('getPoints', {}, { sessionType: 'customer' });
    },
    getPointHistory: function (limit) {
      return call('getPointHistory', { limit: limit || 50 }, { sessionType: 'customer' });
    },
    getWallet: function () {
      return call('getWallet', {}, { sessionType: 'customer' });
    },
    getWalletHistory: function (limit) {
      return call('getWalletHistory', { limit: limit || 50 }, { sessionType: 'customer' });
    },
    getPromotions: function () {
      return call('getPromotions', {}, { sessionType: 'customer' });
    },
    getOrderHistory: function (limit) {
      return call('getOrderHistory', { limit: limit || 50 }, { sessionType: 'customer' });
    },
    getClaimByToken: function (token) {
      return call('getClaimByToken', { token: token }, { sessionType: 'auto' });
    },
    getClaimByCode: function (code) {
      return call('getClaimByCode', { code: code }, { sessionType: 'auto' });
    },

    claimOrder: function (tokenOrCode) {
      var payload = (typeof tokenOrCode === 'string')
        ? { token: tokenOrCode }
        : (tokenOrCode || {});
      return call('claimOrder', payload, { sessionType: 'auto' });
    },
    getPendingReward: function (rewardId) {
      return call('getPendingReward', { rewardId: rewardId || '' }, { sessionType: 'customer' });
    },
    claimReward: function (rewardId) {
      return call('claimReward', { rewardId: rewardId }, { sessionType: 'customer' });
    }
  };

  /* ========================================================
     STAFF API
     ======================================================== */
  var staff = {
    login: function (username, password) {
      return call('staffLogin', { username: username, password: password }, { sessionType: null });
    },
    logout: function () {
      return call('staffLogout', {}, { sessionType: 'staff' });
    },
    getSession: function () {
      return call('getStaffSession', {}, { sessionType: 'staff' });
    },
    getDashboard: function (date) {
      return call('getDashboard', { date: date || '' }, { sessionType: 'staff' });
    },
    createClaim: function (source, externalOrderId, amountSen, note) {
      return call('createClaim', {
        source: source,
        externalOrderId: externalOrderId,
        amount: amountSen,
        note: note || ''
      }, { sessionType: 'staff' });
    },
    cancelClaim: function (claimId) {
      return call('cancelClaim', { claimId: claimId }, { sessionType: 'staff' });
    },
    getClaim: function (claimId) {
      return call('getClaim', { claimId: claimId }, { sessionType: 'staff' });
    },
    listClaims: function (limit) {
      return call('listClaims', { limit: limit || 20 }, { sessionType: 'staff' });
    },
    searchCustomer: function (keyword) {
      return call('searchCustomer', { keyword: keyword }, { sessionType: 'staff' });
    },
    getCustomer: function (customerId) {
      return call('getCustomer', { customerId: customerId }, { sessionType: 'staff' });
    },
    getCustomerHistory: function (customerId) {
      return call('getCustomerHistory', { customerId: customerId }, { sessionType: 'staff' });
    },
    calculateWalletRedemption: function (customerId, billSen) {
      return call('calculateWalletRedemption', {
        customerId: customerId,
        billAmount: billSen
      }, { sessionType: 'staff' });
    },
    redeemWallet: function (customerId, billSen, walletSen, externalOrderId, source, note) {

  var admin = {

/* ---- js/auth.js ---- */
/* =============================================================
   YETIPSY — auth.js
   -------------------------------------------------------------
   Session 管理（前端只保存 token，一切权限由后端判定）

   ⚠️ 安全说明（第一版限制）：
   手机号码登录（无 OTP）不属于强身份验证。
   因此不得仅凭此登录允许：
     - 手动转账 Wallet
     - 敏感资料修改
     - 任何 Admin 功能
   详见 README.md
   ============================================================= */

var AUTH = (function () {

  var S = YETIPSY_CONFIG.STORAGE;

  /* ----------------------------------------------------------
     Storage：优先 localStorage，不可用时（例如被 sandbox 的预览环境）
     自动退回记忆体储存，让 App 仍然可以操作
     ---------------------------------------------------------- */
  var memoryStore = {};
  var storageAvailable = (function () {
    try {
      localStorage.setItem('__yt_test__', '1');
      localStorage.removeItem('__yt_test__');
      return true;
    } catch (e) { return false; }
  })();

  function get(key) {
    if (!storageAvailable) return Object.prototype.hasOwnProperty.call(memoryStore, key) ? memoryStore[key] : null;
    try { return localStorage.getItem(key); } catch (e) { return memoryStore[key] || null; }
  }
  function set(key, value) {
    memoryStore[key] = value;
    if (!storageAvailable) return;
    try { localStorage.setItem(key, value); } catch (e) {}
  }
  function del(key) {
    delete memoryStore[key];
    if (!storageAvailable) return;
    try { localStorage.removeItem(key); } catch (e) {}
  }

  /* ---------------- CUSTOMER ---------------- */

  function getCustomerToken() {
    return get(S.CUSTOMER_TOKEN) || '';
  }

  function setCustomerSession(token, profile) {
    set(S.CUSTOMER_TOKEN, token);
    if (profile) set(S.CUSTOMER_PROFILE, JSON.stringify(profile));
  }

  function getCustomerProfile() {
    var raw = get(S.CUSTOMER_PROFILE);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function setCustomerProfile(profile) {
    set(S.CUSTOMER_PROFILE, JSON.stringify(profile));
  }

  function clearCustomer() {
    del(S.CUSTOMER_TOKEN);
    del(S.CUSTOMER_PROFILE);
  }

  function isCustomerLoggedIn() {
    return !!getCustomerToken();
  }

  /**
   * 会员页面守卫：未登录 → 去登录页（记住回跳地址）
   */
  function requireCustomer(redirectBack) {
    if (!isCustomerLoggedIn()) {
      var url = 'login.html';
      if (redirectBack !== false) {
        url += '?redirect=' + encodeURIComponent(UI.currentPage() + (typeof ROUTER !== 'undefined' && ROUTER.isSingleFile() ? ROUTER.search() : location.search));
      }
      UI.go(url);
      return false;
    }
    return true;
  }

  /* ---------------- STAFF ---------------- */

  function getStaffToken() {
    return get(S.STAFF_TOKEN) || '';
  }

  function setStaffSession(token, profile) {
    set(S.STAFF_TOKEN, token);
    if (profile) set(S.STAFF_PROFILE, JSON.stringify(profile));
  }

  function getStaffProfile() {
    var raw = get(S.STAFF_PROFILE);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function clearStaff() {
    del(S.STAFF_TOKEN);
    del(S.STAFF_PROFILE);
  }

  function isStaffLoggedIn() {
    return !!getStaffToken();
  }

  function requireStaff() {
    if (!isStaffLoggedIn()) {
      UI.go('login.html');
      return false;
    }
    return true;
  }

  /** 角色判断（仅用于 UI 显示隐藏，后端仍会再验证一次） */
  function hasRole(role) {
    var p = getStaffProfile();
    if (!p) return false;
    if (role === 'STAFF') return true;
    if (role === 'MANAGER') return p.role === 'MANAGER' || p.role === 'OWNER';
    if (role === 'OWNER') return p.role === 'OWNER';
    return false;
  }

  /* ---------------- 共用 ---------------- */

  function handleSessionError(error) {
    if (!error) return false;
    if (error.code === 'INVALID_SESSION' || error.code === 'SESSION_EXPIRED') {
      var isAdmin = UI.currentPath().indexOf('/admin/') !== -1;
      if (isAdmin) {
        clearStaff();
        UI.go('login.html');
      } else {
        clearCustomer();
        UI.go('login.html?redirect=' + encodeURIComponent(UI.currentPage()));
      }
      return true;
    }
    return false;
  }

  return {
    getCustomerToken: getCustomerToken,
    setCustomerSession: setCustomerSession,
    getCustomerProfile: getCustomerProfile,
    setCustomerProfile: setCustomerProfile,
    clearCustomer: clearCustomer,
    isCustomerLoggedIn: isCustomerLoggedIn,
    requireCustomer: requireCustomer,

    getStaffToken: getStaffToken,
    setStaffSession: setStaffSession,
    getStaffProfile: getStaffProfile,
    clearStaff: clearStaff,
    isStaffLoggedIn: isStaffLoggedIn,
    requireStaff: requireStaff,
    hasRole: hasRole,

    handleSessionError: handleSessionError
  };
})();


/* ---- js/ui.js ---- */
/* =============================================================
   YETIPSY — ui.js
   -------------------------------------------------------------
   共用 UI 工具：金额格式化（sen）、Toast、底部导航、
   中英双语标签、QR 生成、QR 扫描、载入状态
   ============================================================= */

var UI = (function () {

  /* =========================================================
     1. 格式化
     后端所有金额一律使用 SEN（整数）
     RM50   = 5000
     RM8.68 = 868
     ========================================================= */

  function money(sen, withSymbol) {
    if (sen === null || sen === undefined || sen === '') sen = 0;
    var v = Number(sen) / 100;
    var s = v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (withSymbol === false ? '' : YETIPSY_CONFIG.CURRENCY + ' ') + s;
  }

  function moneyPlain(sen) {
    if (sen === null || sen === undefined) sen = 0;
    return (Number(sen) / 100).toFixed(2);
  }

  /** RM 输入字串 → sen（整数）。非法返回 null */
  function parseMoneyToSen(str) {
    if (str === null || str === undefined) return null;
    var cleaned = String(str).replace(/[^0-9.]/g, '');
    if (cleaned === '' || isNaN(parseFloat(cleaned))) return null;
    var sen = Math.round(parseFloat(cleaned) * 100);
    if (!isFinite(sen) || sen < 0) return null;
    return sen;
  }

  function points(n) {
    n = Number(n) || 0;
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function dateTime(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleString('en-GB', {
      timeZone: YETIPSY_CONFIG.TIMEZONE,
      day: '2-digit', month: 'short',
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  }

  function dateOnly(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    return d.toLocaleDateString('en-GB', {
      timeZone: YETIPSY_CONFIG.TIMEZONE,
      day: '2-digit', month: 'short'
    });
  }

  function timeOnly(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleTimeString('en-GB', {
      timeZone: YETIPSY_CONFIG.TIMEZONE,
      hour: '2-digit', minute: '2-digit', hour12: false
    });
  }

  /* =========================================================
     2. 双语
     ========================================================= */

  /** 回传 <span class="bi">中文<small>ENGLISH</small></span> */
  function bi(zh, en) {
    return '<span class="bi"><b>' + esc(zh) + '</b><i>' + esc(en) + '</i></span>';
  }

  /** 横向双语（用于小标签） */
  function biInline(zh, en) {
    return '<span class="bi-inline">' + esc(zh) + ' <em>' + esc(en) + '</em></span>';
  }

  function esc(str) {
    return String(str === null || str === undefined ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  /* =========================================================
     3. 会员等级
     ========================================================= */

  function tierName(tier) {
    return (tier || 'MEMBER').toUpperCase();
  }

  function tierLabel(tier) {
    var t = tierName(tier);
    if (t === 'GOLD') return bi('黄金会员', 'GOLD MEMBER');
    if (t === 'SILVER') return bi('白银会员', 'SILVER MEMBER');
    return bi('会员', 'MEMBER');
  }

  function tierBadge(tier) {
    var t = tierName(tier);
    return '<span class="tier tier-' + t.toLowerCase() + '">' + t + '</span>';
  }

  function tierColor(tier) {
    return YETIPSY_CONFIG.TIER_COLORS[tierName(tier)] || YETIPSY_CONFIG.TIER_COLORS.MEMBER;
  }

  /* =========================================================
     4. Toast
     ========================================================= */

  function toast(message, type, duration) {
    var box = document.getElementById('toastBox');
    if (!box) {
      box = document.createElement('div');
      box.id = 'toastBox';
      box.className = 'toast-box';
      document.body.appendChild(box);
    }
    var el = document.createElement('div');
    el.className = 'toast toast-' + (type || 'info');
    el.textContent = message;
    box.appendChild(el);
    requestAnimationFrame(function () { el.classList.add('show'); });
    setTimeout(function () {
      el.classList.remove('show');
      setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
    }, duration || 2600);
  }

  /* =========================================================
     5. Loading
     ========================================================= */

  function showLoading(text) {
    var el = document.getElementById('loadingOverlay');
    if (!el) {
      el = document.createElement('div');
      el.id = 'loadingOverlay';
      el.className = 'loading-overlay';
      el.innerHTML = '<div class="spinner"></div><div class="loading-text"></div>';
      document.body.appendChild(el);
    }
    el.querySelector('.loading-text').textContent = text || '';
    el.classList.add('show');
  }

  function hideLoading() {
    var el = document.getElementById('loadingOverlay');
    if (el) el.classList.remove('show');
  }

  function setLoading(button, isLoading, loadingText) {
    if (!button) return;
    if (isLoading) {
      button.dataset.text = button.innerHTML;
      button.disabled = true;
      button.classList.add('is-loading');
      button.innerHTML = '<span class="btn-spinner"></span>' + esc(loadingText || 'LOADING');
    } else {
      button.disabled = false;
      button.classList.remove('is-loading');
      if (button.dataset.text) button.innerHTML = button.dataset.text;
    }
  }

  /* =========================================================
     6. 底部导航（会员端）
     ========================================================= */

  var NAV = [
    { page: 'index.html',    zh: '首页',   en: 'HOME',     icon: 'home' },
    { page: 'activity.html', zh: '记录',   en: 'ACTIVITY', icon: 'activity' },
    { page: 'wallet.html',   zh: '钱包',   en: 'WALLET',   icon: 'wallet' },
    { page: 'profile.html',  zh: '我的',   en: 'PROFILE',  icon: 'profile' }
  ];

  var ICONS = {
    home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/>',
    activity: '<path d="M4 12h3l2.5-6 3 12L15 12h5"/>',
    wallet: '<path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a1 1 0 0 1 1 1v2"/><path d="M3 7.5V18a1 1 0 0 0 1 1h15a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6"/><circle cx="17" cy="14" r="1.2"/>',
    profile: '<circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c1.2-3.6 4-5.4 7.5-5.4s6.3 1.8 7.5 5.4"/>',
    scan: '<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8"/><path d="M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8"/><path d="M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16"/><path d="M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M4 12h16"/>'
  };

  function icon(name, size) {
    return '<svg class="icon" width="' + (size || 22) + '" height="' + (size || 22) +
      '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'stroke-linecap="round" stroke-linejoin="round">' + (ICONS[name] || '') + '</svg>';
  }

  function renderBottomNav(active) {
    // 先移除旧的（支援重复执行 / 单档预览切换页面）
    Array.prototype.slice.call(document.querySelectorAll('.bottom-nav')).forEach(function (n) {
      if (n.parentNode) n.parentNode.removeChild(n);
    });
    var current = active || currentPage();
    var html = '<nav class="bottom-nav">';
    NAV.forEach(function (item) {
      var isActive = item.page === current;
      html += '<a href="' + item.page + '" class="nav-item' + (isActive ? ' active' : '') + '">' +
        icon(item.icon) +
        '<span class="nav-zh">' + item.zh + '</span>' +
        '<span class="nav-en">' + item.en + '</span>' +
        '</a>';
    });
    html += '</nav>';
    document.body.insertAdjacentHTML('beforeend', html);
    document.body.classList.add('has-bottom-nav');
  }

  /* =========================================================
     7. 顶部栏
     ========================================================= */

  function renderHeader(options) {
    options = options || {};
    var html =
      '<header class="app-header">' +
        '<div class="header-inner">' +
          (options.back
            ? '<a class="header-back" href="' + options.back + '" aria-label="back">' +
              '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>' +
              '</a>'
            : '<span class="header-back-spacer"></span>') +
          '<div class="header-title">' +
            '<div class="ht-zh">' + esc(options.titleZh || '') + '</div>' +
            '<div class="ht-en">' + esc(options.titleEn || '') + '</div>' +
          '</div>' +
          '<div class="header-right">' + (options.right || '') + '</div>' +
        '</div>' +
      '</header>';
    document.body.insertAdjacentHTML('afterbegin', html);
    document.body.classList.add('has-header');
  }

  /* =========================================================
     8. QR 生成
     ========================================================= */

  /** 建立 QR 物件（ECC 等级 M，自动选择版本） */
  function buildQR(text) {
    var qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    return qr;
  }

  /** 以 SVG 绘制 QR（不需要 canvas，任何环境都能显示，且放大不失真） */
  function renderQR(container, text, size) {
    if (!container) return;
    size = size || 220;
    container.innerHTML = '';
    try {
      var qr = buildQR(text);
      var wrap = document.createElement('div');
      wrap.className = 'qr-svg';
      wrap.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 8, scalable: true });
      var svg = wrap.firstChild;
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      container.appendChild(svg);
    } catch (e) {
      container.innerHTML = '<div class="qr-error">QR ERROR</div>';
    }
  }

  /** 生成 QR 图档 DataURL（用于下载 / 分享；优先 PNG，失败则回退 SVG） */
  function qrDataUrl(text, size) {
    try {
      var qr = buildQR(text);
      var count = qr.getModuleCount();
      var cell = Math.max(2, Math.floor((size || 512) / count));
      var real = cell * count;
      var canvas = document.createElement('canvas');
      canvas.width = real;
      canvas.height = real;
      var ctx = canvas.getContext('2d');
      if (ctx) {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, real, real);
        ctx.fillStyle = '#000000';
        for (var r = 0; r < count; r++) {
          for (var c = 0; c < count; c++) {
            if (qr.isDark(r, c)) ctx.fillRect(c * cell, r * cell, cell, cell);
          }
        }
        return canvas.toDataURL('image/png');
      }
      // 没有 canvas（例如某些内嵌预览环境）→ 回退 SVG data URL
      var svg = qr.createSvgTag({ cellSize: cell, margin: cell * 4 });
      return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
    } catch (e) {
      return null;
    }
  }

  /* =========================================================
     9. 空状态 / 错误状态
     ========================================================= */

  function emptyState(zh, en, iconName) {
    return '<div class="empty-state">' +
      '<div class="empty-icon">' + icon(iconName || 'activity', 28) + '</div>' +
      '<div class="empty-zh">' + esc(zh) + '</div>' +
      '<div class="empty-en">' + esc(en) + '</div>' +
      '</div>';
  }

  /* =========================================================
     10. 其他
     ========================================================= */

  function getParam(name) {
    var search = '';
    if (typeof ROUTER !== 'undefined' && ROUTER.isSingleFile()) {
      search = ROUTER.search();
    } else {
      search = location.search;
    }
    var m = String(search).match(new RegExp('[?&]' + name + '=([^&]*)'));
    return m ? decodeURIComponent(m[1]) : '';
  }

  /* =========================================================
     11. 导航（统一入口，支援单档离线预览）
     ========================================================= */

  /** 目前页面档名（例如 index.html / admin/login.html） */
  function currentPage() {
    if (typeof ROUTER !== 'undefined' && ROUTER.isSingleFile()) return ROUTER.current();
    var p = (location.pathname || '').split('/').pop();
    return p || 'index.html';
  }

  /** 目前路径（用来判断是否在 /admin/） */
  function currentPath() {
    if (typeof ROUTER !== 'undefined' && ROUTER.isSingleFile()) return '/' + ROUTER.current();
    return location.pathname || '/';
  }

  /** 目前目录（用于 QR 内容） */
  function basePath() {
    if (typeof ROUTER !== 'undefined' && ROUTER.isSingleFile()) return './';
    var path = (location.pathname || '/').replace(/[^/]*$/, '');
    if (path.indexOf('/admin/') !== -1) path = path.replace(/\/admin\/$/, '/');
    return path;
  }

  /**
   * 页面跳转（统一入口）
   * 一般环境：location.replace
   * 单档离线预览：内部切换页面
   */
  function go(url) {
    if (typeof ROUTER !== 'undefined' && ROUTER.isSingleFile()) {
      ROUTER.go(url);
      return;
    }
    location.replace(url);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        resolve();
      } catch (e) { reject(e); }
    });
  }

  /** 规范化马来西亚电话号码 → +60123456789 */
  function normalizePhone(input) {
    var digits = String(input || '').replace(/[^0-9]/g, '');
    if (digits.indexOf('60') === 0) digits = digits.slice(2);
    else if (digits.indexOf('0') === 0) digits = digits.slice(1);
    if (!digits) return '';
    return '+60' + digits;
  }

  function confirmDialog(messageZh, messageEn, confirmText) {
    return new Promise(function (resolve) {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay show';
      overlay.innerHTML =
        '<div class="modal">' +
          '<div class="modal-zh">' + esc(messageZh) + '</div>' +
          '<div class="modal-en">' + esc(messageEn) + '</div>' +

/* ---- js/admin.js ---- */
/* =============================================================
   YETIPSY — admin.js
   -------------------------------------------------------------
   Staff Admin 共用逻辑：
     · Session 守卫
     · Header / Bottom Nav 渲染
     · 权限（UI 层；后端仍会再验证一次）
   ============================================================= */

var ADMIN = (function () {

  var NAV = [
    { page: 'index.html',     zh: '首页',   en: 'HOME' },
    { page: 'claim.html',     zh: '开单',   en: 'CLAIM' },
    { page: 'customers.html', zh: '顾客',   en: 'MEMBERS' },
    { page: 'more.html',      zh: '更多',   en: 'MORE' }
  ];

  /* ---------------- 守卫 ---------------- */

  function requireAuth() {
    if (!AUTH.isStaffLoggedIn()) {
      UI.go('login.html');
      return false;
    }
    return true;
  }

  /** 页面需要 MANAGER / OWNER 才能看（UI 层） */
  function requireManager() {
    if (!requireAuth()) return false;
    if (!AUTH.hasRole('MANAGER')) {
      UI.toast('需要经理权限 / Manager permission required', 'error');
      setTimeout(function () { UI.go('index.html'); }, 900);
      return false;
    }
    return true;
  }

  /* ---------------- Shell ---------------- */

  function renderShell(options) {
    options = options || {};
    var staff = AUTH.getStaffProfile() || { username: '', role: '' };

    // 先移除旧的（支援重复执行 / 单档预览切换页面）
    Array.prototype.slice.call(document.querySelectorAll('.admin-header, .admin-nav'))
      .forEach(function (n) { if (n.parentNode) n.parentNode.removeChild(n); });
    document.body.classList.remove('has-admin-nav');

    var header = document.createElement('div');
    header.className = 'admin-header';
    header.innerHTML =
      '<div class="admin-header-inner">' +
        '<div class="admin-logo">YETIPSY</div>' +
        '<div class="ah-title">' + UI.esc(options.title || '') + '</div>' +
        '<div class="ah-right">' +
          '<span class="role-pill">' + UI.esc(staff.role || '') + '</span>' +
        '</div>' +
      '</div>';
    document.body.insertAdjacentHTML('afterbegin', header.outerHTML);

    var current = UI.currentPage();
    var nav = '<nav class="admin-nav">';
    NAV.forEach(function (n) {
      nav += '<a href="' + n.page + '" class="' + (n.page === current ? 'active' : '') + '">' +
               '<span>' + n.zh + '</span><span class="an-en">' + n.en + '</span>' +
             '</a>';
    });
    nav += '</nav>';
    document.body.insertAdjacentHTML('beforeend', nav);
    document.body.classList.add('has-admin-nav');

    if (options.onLogout) {
      // header 右侧点击登出由各页面自行绑定
    }
  }

  /* ---------------- 登出 ---------------- */

  function logout() {
    UI.confirmDialog('确定要登出吗？', 'Sign out of staff app?', '登出 SIGN OUT')
      .then(function (yes) {
        if (!yes) return;
        API.staff.logout().then(function () {
          AUTH.clearStaff();
          UI.go('login.html');
        });
      });
  }

  /* ---------------- 工具 ---------------- */

  /** API 错误统一处理（session 过期自动登出） */
  function handleError(error) {
    if (!error) return;
    if (AUTH.handleSessionError(error)) return;
    UI.toast(error.message || error.code, 'error');
  }

  function isManager() { return AUTH.hasRole('MANAGER'); }
  function isOwner()   { return AUTH.hasRole('OWNER'); }

  /** 显示权限不足 */
  function deny() {
    UI.toast('权限不足 / Permission denied', 'error');
  }

  return {
    NAV: NAV,
    requireAuth: requireAuth,
    requireManager: requireManager,
    renderShell: renderShell,
    logout: logout,
    handleError: handleError,
    isManager: isManager,
    isOwner: isOwner,
    deny: deny
  };
})();

<script>
/* =============================================================================
   页面模组（每个页面专属的 JS）
   ============================================================================= */
/* ---- js/app.js ---- */
/* =============================================================
   YETIPSY — app.js  (Customer Home)
   ============================================================= */

var APP = (function () {

  var state = {
    profile: null,
    membership: null,
    promotions: [],
    pendingReward: null
  };

  function greeting() {
    var hour = Number(new Date().toLocaleString('en-GB', {
      timeZone: YETIPSY_CONFIG.TIMEZONE, hour: '2-digit', hour12: false
    }));
    if (hour < 5)  return { zh: '夜深了', en: 'Late night' };
    if (hour < 12) return { zh: '早安', en: 'Good morning' };
    if (hour < 18) return { zh: '午安', en: 'Good afternoon' };
    return { zh: '晚上好', en: 'Good evening' };
  }

  function init() {
    if (YETIPSY_CONFIG.IS_DEMO()) {
      document.getElementById('r0_demoBanner').innerHTML =
        '<div class="demo-banner">DEMO MODE · 演示模式 · 数据保存在本地</div>';
    }

    // icons
    document.getElementById('r0_claimIcon').innerHTML = UI.icon('scan', 24);
    document.getElementById('r0_qiScan').innerHTML    = UI.icon('scan', 20);
    document.getElementById('r0_qiAct').innerHTML     = UI.icon('activity', 20);
    document.getElementById('r0_qiWallet').innerHTML  = UI.icon('wallet', 20);
    document.getElementById('r0_qiProfile').innerHTML = UI.icon('profile', 20);

    var g = greeting();
    document.getElementById('r0_greeting').innerHTML =
      g.zh + '，<b>' + UI.esc(state.profileName || '') + '</b> · ' + g.en;

    load();
  }

  function load() {
    return Promise.all([
      API.customer.getProfile(),
      API.customer.getPendingReward(),
      API.customer.getPromotions()
    ]).then(function (results) {
      var profileRes = results[0];

      if (!profileRes.success) {
        if (!AUTH.handleSessionError(profileRes.error)) {
          UI.toast(profileRes.error.message, 'error');
        }
        return;
      }

      state.profile = profileRes.data.customer;
      state.membership = profileRes.data.membership;
      renderHero();

      // pending reward
      var rewardRes = results[1];
      if (rewardRes.success && rewardRes.data && rewardRes.data.reward) {
        state.pendingReward = rewardRes.data.reward;
        renderPendingReward();
      }

      // promotions
      var promoRes = results[2];
      if (promoRes.success) renderPromotions(promoRes.data.promotions || []);
      else document.getElementById('r0_promoList').innerHTML =
        UI.emptyState('暂无活动', 'NO PROMOTION RIGHT NOW', 'activity');
    });
  }

  function renderHero() {
    var c = state.profile;
    var m = state.membership || {};

    var g = greeting();
    document.getElementById('r0_greeting').innerHTML =
      g.zh + '，<b>' + UI.esc(c.name || 'Friend') + '</b>';
    document.getElementById('r0_tierBadge').innerHTML = UI.tierBadge(c.membershipTier);
    document.getElementById('r0_pointsValue').textContent = UI.points(c.currentPoints);

    document.getElementById('r0_walletValue').textContent = UI.money(c.walletBalance);
    document.getElementById('r0_spendValue').textContent  = UI.money(c.totalSpend);
    document.getElementById('r0_visitsSub').textContent   =
      (c.totalVisits || 0) + ' visits 到店次数';

    // progress
    var pct = m.progressPercent || 0;
    document.getElementById('r0_progressBar').style.width = pct + '%';
    document.getElementById('r0_progressText').textContent =
      UI.tierName(c.membershipTier) + ' · ' + UI.points(c.currentPoints) + ' PTS';
    document.getElementById('r0_progressNext').textContent =
      m.nextTier
        ? UI.points(m.pointsToNext) + ' PTS TO ' + m.nextTier
        : 'TOP TIER 最高等级';
  }

  function renderPendingReward() {
    var r = state.pendingReward;
    if (!r) {
      document.getElementById('r0_pendingRewardBox').innerHTML = '';
      return;
    }
    document.getElementById('r0_pendingRewardBox').innerHTML =
      '<div class="section">' +
        '<a class="card gold" href="reward.html?rewardId=' + encodeURIComponent(r.rewardId) + '" style="display:block">' +
          '<div class="row-between">' +
            '<div>' +
              '<div class="bilingual-zh">你的奖励已准备好</div>' +
              '<div class="bilingual-en">YOUR REWARD IS READY</div>' +
              '<div class="small muted" style="margin-top:8px">点击打开 · Tap to open</div>' +
            '</div>' +
            '<div style="color:var(--gold);font-size:26px">🎁</div>' +
          '</div>' +
        '</a>' +
      '</div>';
  }

  function renderPromotions(list) {
    var box = document.getElementById('r0_promoList');
    if (!list.length) {
      box.innerHTML = UI.emptyState('暂无活动', 'NO PROMOTION RIGHT NOW', 'activity');
      return;
    }
    box.innerHTML = list.map(function (p) {
      return '<div class="promo">' +
        '<div class="promo-title">' + UI.esc(p.title) + '</div>' +
        (p.subtitle ? '<div class="promo-sub">' + UI.esc(p.subtitle) + '</div>' : '') +
        (p.description ? '<div class="promo-desc">' + UI.esc(p.description) + '</div>' : '') +
        ((p.startDate || p.endDate)
          ? '<div class="promo-date">' + UI.esc(p.startDate || '') +
            (p.endDate ? ' — ' + UI.esc(p.endDate) : '') + '</div>'

  }

  return {
    init: init,
    reload: load,
    state: state
  };
})();

/* =============================================================
   YETIPSY — claim.js
   -------------------------------------------------------------
   Claim 流程（QR / Code）
   页面状态：loading → order / entry → result
   ============================================================= */

var CLAIM = (function () {

  var state = {
    token: '',
    code: '',
    claim: null,
    claimed: null
  };

  var el = {};

  function show(id) {
    ['stateLoading', 'stateOrder', 'stateResult', 'stateEntry'].forEach(function (k) {
      if (el[k]) el[k].style.display = (k === id ? 'block' : 'none');
    });
  }

  function init() {
    el.stateLoading = document.getElementById('r2_stateLoading');
    el.stateOrder   = document.getElementById('r2_stateOrder');
    el.stateResult  = document.getElementById('r2_stateResult');
    el.stateEntry   = document.getElementById('r2_stateEntry');

    el.orderAmount  = document.getElementById('r2_orderAmount');
    el.orderMeta    = document.getElementById('r2_orderMeta');
    el.claimBtn     = document.getElementById('r2_claimBtn');
    el.codeInput    = document.getElementById('r2_codeInput');
    el.codeBtn      = document.getElementById('r2_codeBtn');
    el.scanBtn      = document.getElementById('r2_scanBtn');

    document.getElementById('r2_scanIcon').innerHTML = UI.icon('scan', 20);

    el.claimBtn.addEventListener('click', doClaim);
    el.codeBtn.addEventListener('click', submitCode);
    el.scanBtn.addEventListener('click', SCANNER.open);

    el.codeInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') submitCode();
    });

    var token = UI.getParam('token');
    if (token) {
      state.token = token;
      loadClaimByToken(token);
    } else {
      show('stateEntry');
    }
  }

  /* ---------------------------------------------------------
     由 QR 进入：读取 claim
     --------------------------------------------------------- */
  function loadClaimByToken(token) {
    API.customer.getClaimByToken(token).then(function (res) { afterClaimLoad(res, token); });
  }

  function afterClaimLoad(res, token) {
    if (!res.success) {
      if (!AUTH.handleSessionError(res.error)) {
        // 未登录 → 先登录再回来
        if (res.error.code === 'INVALID_SESSION' || res.error.code === 'UNAUTHORIZED') {
          AUTH.clearCustomer();
          UI.go('login.html?redirect=' +
            encodeURIComponent('claim.html?token=' + encodeURIComponent(token)));
          return;
        }
        showError(res.error);
      }
      return;
    }
    state.claim = res.data.claim;
    renderOrder();
  }

  function renderOrder() {
    var c = state.claim;
    el.orderAmount.textContent = UI.money(c.amount);
    el.orderMeta.innerHTML =
      (c.sourceLabel || c.source) + ' ORDER · #' + UI.esc(c.externalOrderId || c.orderId) +
      '<br><span class="tiny muted-2">' + UI.esc(c.createdAtText || '') + '</span>';
    show('stateOrder');
  }

  /* ---------------------------------------------------------
     Code 认领
     --------------------------------------------------------- */
  function submitCode() {
    var code = (el.codeInput.value || '').trim().toUpperCase();
    if (code.length < 4) {
      UI.toast('请输入 4–6 位 Claim Code / Enter the claim code', 'error');
      return;
    }
    UI.setLoading(el.codeBtn, true, 'CHECKING');
    API.customer.getClaimByCode(code).then(function (res) {
      UI.setLoading(el.codeBtn, false);
      if (!res.success) {
        if (!AUTH.handleSessionError(res.error)) UI.toast(res.error.message, 'error');
        return;
      }
      state.token = res.data.claim.token || '';
      state.code  = res.data.claim.claimCode || code;
      state.claim = res.data.claim;
      renderOrder();
    });
  }

  /* ---------------------------------------------------------
     执行认领
     --------------------------------------------------------- */
  function doClaim() {
    if (!state.token && !state.code) {
      UI.toast('缺少 Claim Token / Missing claim token', 'error');
      return;
    }
    UI.setLoading(el.claimBtn, true, 'CLAIMING');
    API.customer.claimOrder({ token: state.token || '', code: state.code || '' }).then(function (res) {
      UI.setLoading(el.claimBtn, false);
      if (!res.success) {
        if (!AUTH.handleSessionError(res.error)) UI.toast(res.error.message, 'error');
        return;
      }
      renderResult(res.data);
    });
  }

  function renderResult(data) {
    state.claimed = data;
    document.getElementById('r2_resultAmount').textContent = UI.money(data.amount);
    document.getElementById('r2_resultPoints').textContent = '+' + UI.points(data.pointsEarned) + ' POINTS';

    if (data.reward && data.reward.rewardId) {
      document.getElementById('r2_resultRewardBtn').style.display = 'block';
      document.getElementById('r2_openRewardLink').href =
        'reward.html?rewardId=' + encodeURIComponent(data.reward.rewardId);
      document.getElementById('r2_resultNote').innerHTML =
        '你的奖励已经准备好<br>Your reward is ready.';
    } else {
      document.getElementById('r2_resultRewardBtn').style.display = 'none';
      document.getElementById('r2_resultNote').innerHTML =
        '感谢你的支持<br>Thank you for the support.';
    }
    show('stateResult');
  }

  function showError(error) {
    el.stateLoading.innerHTML =
      '<div class="card order-card">' +
        '<div style="font-size:38px">✕</div>' +
        '<div class="bilingual-zh mt-12">' + UI.esc(error.message || error.code) + '</div>' +
        '<div class="bilingual-en">' + UI.esc(error.code || '') + '</div>' +
        '<a class="btn btn-secondary mt-16" href="claim.html">' +
          '<span>重新扫描<span class="btn-sub-label">TRY AGAIN</span></span></a>' +
      '</div>';
    show('stateLoading');
  }

  return { init: init };
})();


/* =============================================================
   SCANNER — 使用 jsQR 扫描员工 QR
   ============================================================= */
var SCANNER = (function () {

  var wrap, video, stream = null, rafId = null, running = false;

  function open() {
    if (running) return;

    if (typeof jsQR === 'undefined') {
      UI.toast('请改用输入 Claim Code / Please enter the claim code', 'info');
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      UI.toast('此浏览器不支持相机 / Camera not supported', 'error');
      return;
    }

    wrap = document.createElement('div');
    wrap.className = 'scanner-wrap';
    wrap.innerHTML =
      '<video class="scanner-video" playsinline muted autoplay></video>' +
      '<div class="scanner-frame"></div>' +
      '<div class="scanner-bottom">' +
        '<div class="scanner-title">扫描 YETIPSY CLAIM QR</div>' +
        '<div class="scanner-sub">把 QR 放进框内 · Put the QR inside the frame</div>' +
        '<button class="btn btn-ghost btn-sm mt-12" id="scannerClose">取消 CANCEL</button>' +
      '</div>';
    document.body.appendChild(wrap);

    video = wrap.querySelector('video');
    wrap.querySelector('#scannerClose').addEventListener('click', close);

    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(function (s) {
        stream = s;
        video.srcObject = s;
        video.setAttribute('playsinline', 'true');
        return video.play();
      })
      .then(function () {
        running = true;
        tick();
      })
      .catch(function (err) {
        UI.toast('无法使用相机 / Camera unavailable: ' + (err.name || ''), 'error');
        close();
      });
  }

  function tick() {
    if (!running) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      var canvas = document.createElement('canvas');
      var w = 400, h = Math.round(video.videoHeight * (w / video.videoWidth)) || 400;
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);
      var imageData = ctx.getImageData(0, 0, w, h);
      var code = jsQR(imageData.data, w, h, { inversionAttempts: 'dontInvert' });
      if (code && code.data) {
        handleResult(code.data);
        return;
      }
    }
    rafId = requestAnimationFrame(tick);
  }

  function handleResult(text) {
    var token = '';
    try {
      var url = new URL(text);
      token = url.searchParams.get('token') || '';
    } catch (e) {
      // 不是 URL，可能就是 token 本身
      token = (/^[A-Za-z0-9_\-]{20,}$/.test(text)) ? text : '';
    }
    close();
    if (token) {
      UI.go('claim.html?token=' + encodeURIComponent(token));
    } else {
      UI.toast('这不是 YETIPSY QR / Not a Yetipsy QR', 'error');
    }
  }

  function close() {
    running = false;
    if (rafId) cancelAnimationFrame(rafId);
    if (stream) {
      stream.getTracks().forEach(function (t) { t.stop(); });
      stream = null;
    }
    if (wrap && wrap.parentNode) wrap.parentNode.removeChild(wrap);
    wrap = null; video = null;
  }

  return { open: open, close: close };
})();


/* ---- js/reward.js ---- */
/* =============================================================
   YETIPSY — reward.js
   -------------------------------------------------------------
   Reward 只能由后端产生：
     后端 validate → 产生 reward → 前端只负责动画
   本文件不参与任何金额计算。
   ============================================================= */

var REWARD = (function () {

  var state = { reward: null, opened: false };

  function show(id) {
    // 注意：这里必须用字面 id，单档离线版建置时才能自动加上页面前缀
    var nodes = {
      stateLoading: document.getElementById('r3_stateLoading'),
      stateClosed:  document.getElementById('r3_stateClosed'),
      stateOpened:  document.getElementById('r3_stateOpened'),
      stateError:   document.getElementById('r3_stateError')
    };
    Object.keys(nodes).forEach(function (k) {
      if (nodes[k]) nodes[k].style.display = (k === id ? 'block' : 'none');
    });
  }

  function init() {
    if (!AUTH.isCustomerLoggedIn()) {
      AUTH.requireCustomer();
      return;
    }

    document.getElementById('r3_envelope').addEventListener('click', openReward);

    var rewardId = UI.getParam('rewardId') || '';

    API.customer.getPendingReward(rewardId).then(function (res) {
      if (!res.success) {
        if (!AUTH.handleSessionError(res.error)) showError(res.error);
        return;
      }
      var reward = res.data.reward;
      if (!reward) {
        showError({ code: 'REWARD_NOT_FOUND', message: '目前没有可开启的奖励 / No reward available right now.' });
        return;
      }
      state.reward = reward;
      var meta = document.getElementById('r3_closedMeta');
      meta.innerHTML = reward.orderInfo
        ? UI.esc(reward.orderInfo.amountText || '') + ' · ' + UI.esc(reward.orderInfo.externalOrderId || '')
        : '';
      show('stateClosed');
    });
  }

  function openReward() {
    if (state.opened) return;
    state.opened = true;

    var env = document.getElementById('r3_envelope');
    env.classList.remove('shake');
    env.style.transition = 'transform .35s ease, opacity .35s ease';
    env.style.transform = 'scale(.9)';
    env.style.opacity = '0';

    setTimeout(function () {
      UI.showLoading('OPENING');
      API.customer.claimReward(state.reward.rewardId).then(function (res) {
        UI.hideLoading();
        if (!res.success) {
          state.opened = false;
          env.style.transform = 'scale(1)';
          env.style.opacity = '1';
          env.classList.add('shake');
          if (!AUTH.handleSessionError(res.error)) UI.toast(res.error.message, 'error');
          return;
        }
        renderOpened(res.data);
      });
    }, 320);
  }

  function renderOpened(data) {
    document.getElementById('r3_rewardAmount').textContent = UI.money(data.amount);
    document.getElementById('r3_walletAfter').textContent  = UI.money(data.walletBalance);
    show('stateOpened');
    confetti();
    if (navigator.vibrate) { try { navigator.vibrate([18, 40, 26]); } catch (e) {} }
  }

  function confetti() {
    var box = document.createElement('div');
    box.className = 'confetti';
    document.body.appendChild(box);
    var colors = ['#E5B769', '#F4F1EA', '#C9A227', '#A7A7A7', '#8B6F3A'];
    for (var i = 0; i < 60; i++) {
      var s = document.createElement('span');
      s.style.left = Math.random() * 100 + '%';
      s.style.background = colors[i % colors.length];
      s.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      s.style.animationDelay = (Math.random() * 0.5) + 's';
      s.style.height = (8 + Math.random() * 8) + 'px';
      s.style.opacity = String(0.5 + Math.random() * 0.5);
      box.appendChild(s);
    }
    setTimeout(function () { if (box.parentNode) box.parentNode.removeChild(box); }, 3600);
  }

  function showError(error) {
    document.getElementById('r3_stateError').innerHTML =
      '<div class="card order-card">' +
        '<div style="font-size:38px">✕</div>' +
        '<div class="bilingual-zh mt-12">' + UI.esc(error.message || '') + '</div>' +
        '<div class="bilingual-en">' + UI.esc(error.code || '') + '</div>' +
        '<a class="btn btn-secondary mt-16" href="index.html">' +
          '<span>返回首页<span class="btn-sub-label">BACK TO HOME</span></span></a>' +
      '</div>';
    show('stateError');
  }

  return { init: init };
})();

      '</div>';
    }).join('') + '</div>';
  }

})();

var PROFILE = (function () {

  var profile = null;

  function init() {

    if (cached) render(cached);

    document.getElementById('r6_saveBtn').addEventListener('click', save);

        return;
      }
      render(res.data.customer);
      AUTH.setCustomerProfile(res.data.customer);

  }

  function render(c) {
    profile = c;
    document.getElementById('r6_memberName').textContent = c.name || 'Yetipsy Friend';
    document.getElementById('r6_memberId').textContent   = c.customerId;
    document.getElementById('r6_memberTier').innerHTML   = UI.tierBadge(c.membershipTier);
    document.getElementById('r6_statPoints').textContent = UI.points(c.currentPoints);
    document.getElementById('r6_statWallet').textContent = UI.money(c.walletBalance);
    document.getElementById('r6_statSpend').textContent  = UI.money(c.totalSpend);
    document.getElementById('r6_statVisits').textContent = UI.points(c.totalVisits);

    document.getElementById('r6_nameInput').value     = c.name || '';
    document.getElementById('r6_birthdayInput').value = c.birthday || '';
    document.getElementById('r6_phoneInput').value    = c.phone || '';
  }

  function save() {
    var name     = document.getElementById('r6_nameInput').value.trim();
    var birthday = document.getElementById('r6_birthdayInput').value;
    var btn      = document.getElementById('r6_saveBtn');

    UI.setLoading(btn, true, 'SAVING');

      UI.setLoading(btn, false);

        if (!AUTH.handleSessionError(res.error)) UI.toast(res.error.message, 'error');
        return;
      }
      UI.toast('已保存 / Profile saved', 'success');
      render(res.data.customer);
      AUTH.setCustomerProfile(res.data.customer);

  function logout() {
    UI.confirmDialog('确定要登出吗？', 'Log out from this device?', '登出 LOG OUT')
      .then(function (yes) {
        if (!yes) return;
        API.customer.logout().then(function () {
