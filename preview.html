/* ---- js/admin-claim.js ---- */
/* =============================================================
   YETIPSY — admin-claim.js
   -------------------------------------------------------------
   员工最常用的功能：建立 Claim（5–10 秒完成）
   目标流程：来源 → 订单号 → 金额 → CREATE → QR / Code
   ============================================================= */

var ADMIN_CLAIM = (function () {

  var state = {
    source: 'FOODCOURT',
    lastClaim: null
  };

  var el = {};

  function init() {
    el.viewForm   = document.getElementById('r9_viewForm');
    el.viewResult = document.getElementById('r9_viewResult');
    el.orderNo    = document.getElementById('r9_orderNoInput');
    el.amount     = document.getElementById('r9_amountInput');
    el.createBtn  = document.getElementById('r9_createBtn');
    el.resAmount  = document.getElementById('r9_resAmount');
    el.resOrder   = document.getElementById('r9_resOrder');
    el.resCode    = document.getElementById('r9_resCode');
    el.resExpiry  = document.getElementById('r9_resExpiry');
    el.qr         = document.getElementById('r9_qrContainer');

    // 来源切换
    document.getElementById('r9_sourceSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      state.source = btn.getAttribute('data-source');
      document.getElementById('r9_orderNoHint').textContent =
        state.source === 'FOODCOURT'
          ? '输入 Foodcourt 订单号码 · Enter the Foodcourt order number'
          : '可留空，系统会自动产生 · Optional, auto-generated';
      el.orderNo.focus();
    });

    el.createBtn.addEventListener('click', create);
    document.getElementById('r9_newClaimBtn').addEventListener('click', reset);
    document.getElementById('r9_copyBtn').addEventListener('click', copyCode);
    document.getElementById('r9_cancelBtn').addEventListener('click', cancelClaim);

    el.amount.addEventListener('keydown', function (e) { if (e.key === 'Enter') create(); });
    el.orderNo.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.amount.focus(); });

    // 金额输入限制
    el.amount.addEventListener('input', function () {
      var v = this.value.replace(/[^0-9.]/g, '');
      var parts = v.split('.');
      if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
      if (v.indexOf('.') >= 0) {
        var seg = v.split('.');
        if (seg[1].length > 2) v = seg[0] + '.' + seg[1].slice(0, 2);
      }
      this.value = v;
    });

    el.orderNo.focus();
    loadRecent();
  }

  function create() {
    var externalOrderId = el.orderNo.value.trim().toUpperCase();
    var amountSen = UI.parseMoneyToSen(el.amount.value);

    if (state.source === 'FOODCOURT' && !externalOrderId) {
      UI.toast('请输入订单号码 / Order number required', 'error');
      el.orderNo.focus();
      return;
    }
    if (amountSen === null || amountSen <= 0) {
      UI.toast('请输入有效金额 / Enter a valid amount', 'error');
      el.amount.focus();
      return;
    }
    if (amountSen > 100000000) {
      UI.toast('金额过大 / Amount too large', 'error');
      return;
    }

    UI.setLoading(el.createBtn, true, 'CREATING');

    API.staff.createClaim(state.source, externalOrderId, amountSen, '').then(function (res) {
      UI.setLoading(el.createBtn, false);
      if (!res.success) {
        ADMIN.handleError(res.error);
        return;
      }
      showResult(res.data);
      loadRecent();
    });
  }

  function showResult(claim) {
    state.lastClaim = claim;

    el.resAmount.textContent = UI.money(claim.amount);
    el.resOrder.textContent  =
      (claim.source === 'FOODCOURT' ? 'Order #' : 'Ref #') + (claim.externalOrderId || claim.orderId);
    el.resCode.textContent   = claim.claimCode;
    el.resExpiry.textContent = 'EXPIRES ' + UI.dateTime(claim.expiresAt);

    var url = YETIPSY_CONFIG.buildClaimUrl(claim.token);
    UI.renderQR(el.qr, url, 220);

    el.viewForm.style.display = 'none';
    el.viewResult.style.display = 'block';
    window.scrollTo(0, 0);
  }

  function reset() {
    state.lastClaim = null;
    el.orderNo.value = '';
    el.amount.value  = '';
    el.viewResult.style.display = 'none';
    el.viewForm.style.display = 'block';
    el.orderNo.focus();
  }

  function copyCode() {
    if (!state.lastClaim) return;
    UI.copyToClipboard(state.lastClaim.claimCode)
      .then(function () { UI.toast('Code copied / 已复制', 'success'); })
      .catch(function () { UI.toast('Copy failed / 复制失败', 'error'); });
  }

  function cancelClaim() {
    if (!state.lastClaim) return;
    UI.confirmDialog('确定要取消这个 Claim 吗？', 'Cancel this claim? Points cannot be issued afterwards.', '取消 CANCEL')
      .then(function (yes) {
        if (!yes) return;
        UI.showLoading('CANCELLING');
        API.staff.cancelClaim(state.lastClaim.claimId).then(function (res) {
          UI.hideLoading();
          if (!res.success) { ADMIN.handleError(res.error); return; }
          UI.toast('Claim cancelled / 已取消', 'success');
          reset();
          loadRecent();
        });
      });
  }

  function loadRecent() {
    API.staff.listClaims(12).then(function (res) {
      var box = document.getElementById('r9_recentList');
      if (!res.success || !res.data.claims || !res.data.claims.length) {
        box.innerHTML = '<div class="a-empty">No claims yet / 还没有记录</div>';
        return;
      }
      box.innerHTML = '<div class="a-list">' + res.data.claims.map(function (c) {
        var chip =
          c.status === 'AVAILABLE' ? 'chip gold' :
          c.status === 'CLAIMED'   ? 'chip ok'   :
          c.status === 'EXPIRED'   ? 'chip'      : 'chip danger';
        return '<div class="a-item">' +
          '<div class="a-main">' +
            '<div class="a-title">' + UI.money(c.amount) +
              ' <span class="tiny muted-2">#' + UI.esc(c.externalOrderId || c.orderId) + '</span></div>' +
            '<div class="a-sub">' + UI.esc(c.source) + ' · ' + UI.esc(c.claimCode) +
              ' · ' + UI.esc(UI.timeOnly(c.createdAt)) +
              (c.customerName ? ' · ' + UI.esc(c.customerName) : '') +
            '</div>' +
          '</div>' +
          '<div class="a-right"><span class="' + chip + '">' + UI.esc(c.status) + '</span></div>' +
        '</div>';
      }).join('') + '</div>';
    });
  }

  return { init: init, reload: loadRecent };
})();


/* ---- js/admin-customer.js ---- */
/* =============================================================
   YETIPSY — admin-customer.js
   -------------------------------------------------------------
   员工查找会员 → 查看资料 → 钱包抵扣（由员工发起/确认）
   Manager / Owner 额外：调整 Wallet / Points
   ============================================================= */

var ADMIN_CUSTOMER = (function () {

  var state = {
    customer: null,
    calc: null,
    calcTimer: null
  };

  var el = {};

  function init() {
    el.search     = document.getElementById('r10_searchInput');
    el.results    = document.getElementById('r10_searchResults');
    el.detail     = document.getElementById('r10_detailView');
    el.bill       = document.getElementById('r10_billInput');
    el.calcBox    = document.getElementById('r10_calcBox');
    el.calcHint   = document.getElementById('r10_calcHint');
    el.redeemBtn  = document.getElementById('r10_redeemBtn');

    el.search.addEventListener('input', debounce(doSearch, 320));
    el.search.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
    el.bill.addEventListener('input', onBillInput);
    el.redeemBtn.addEventListener('click', doRedeem);
    document.getElementById('r10_backBtn').addEventListener('click', backToSearch);
    document.getElementById('r10_adjustWalletBtn').addEventListener('click', function () { adjust('wallet'); });
    document.getElementById('r10_adjustPointsBtn').addEventListener('click', function () { adjust('points'); });

    el.search.focus();
  }

  function debounce(fn, wait) {
    var t;
    return function () {
      var args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(function () { fn.apply(ctx, args); }, wait);
    };
  }

  /* ---------------- SEARCH ---------------- */

  function doSearch() {
    var keyword = el.search.value.trim();
    if (keyword.length < 3) {
      el.results.innerHTML = '';
      return;
    }
    API.staff.searchCustomer(keyword).then(function (res) {
      if (!res.success) { ADMIN.handleError(res.error); return; }
      var list = res.data.customers || [];
      if (!list.length) {
        el.results.innerHTML = '<div class="a-empty">No member found / 找不到会员<br>' +
          '<span class="tiny">可用手机号码注册新会员（顾客端）</span></div>';
        return;
      }
      el.results.innerHTML = '<div class="a-list">' + list.map(function (c) {
        return '<div class="a-item cust-card" data-id="' + UI.esc(c.customerId) + '">' +
          '<div class="a-main">' +
            '<div class="a-title">' + UI.esc(c.name || 'Yetipsy Friend') + '</div>' +
            '<div class="a-sub">' + UI.esc(c.customerId) + ' · ' + UI.esc(c.phone) + '</div>' +
          '</div>' +
          '<div class="a-right">' +
            '<div class="a-value" style="color:var(--a-gold)">' + UI.money(c.walletBalance) + '</div>' +
            '<div class="a-meta">' + UI.points(c.currentPoints) + ' PTS</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';

      Array.prototype.forEach.call(el.results.querySelectorAll('.cust-card'), function (node) {
        node.addEventListener('click', function () {
          openCustomer(node.getAttribute('data-id'));
        });
      });
    });
  }

  /* ---------------- DETAIL ---------------- */

  function openCustomer(customerId) {
    API.staff.getCustomer(customerId).then(function (res) {
      if (!res.success) { ADMIN.handleError(res.error); return; }
      state.customer = res.data.customer;
      renderDetail();
      loadHistory(customerId);
    });
  }

  function renderDetail() {
    var c = state.customer;
    el.results.style.display = 'none';
    el.search.style.display  = 'none';
    el.detail.style.display  = 'block';

    document.getElementById('r10_cName').textContent   = c.name || 'Yetipsy Friend';
    document.getElementById('r10_cId').textContent     = c.customerId;
    document.getElementById('r10_cPhone').textContent  = c.phone;
    document.getElementById('r10_cTier').innerHTML     = UI.tierBadge(c.membershipTier);
    document.getElementById('r10_cPoints').textContent = UI.points(c.currentPoints);
    document.getElementById('r10_cWallet').textContent = UI.money(c.walletBalance);
    document.getElementById('r10_cSpend').textContent  = UI.money(c.totalSpend);
    document.getElementById('r10_cVisits').textContent = c.totalVisits;

    if (ADMIN.isManager()) {
      document.getElementById('r10_managerActions').style.display = 'block';
    }

    el.bill.value = '';
    el.calcBox.style.display = 'none';
    el.redeemBtn.style.display = 'none';
    state.calc = null;
    window.scrollTo(0, 0);
  }

  function backToSearch() {
    el.detail.style.display = 'none';
    el.search.style.display = 'block';
    el.results.style.display = 'block';
    el.search.value = '';
    el.results.innerHTML = '';
    state.customer = null;
    el.search.focus();
  }

  /* ---------------- REDEEM ---------------- */

  function onBillInput() {
    var v = this.value.replace(/[^0-9.]/g, '');
    var parts = v.split('.');
    if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
    if (v.indexOf('.') >= 0) {
      var seg = v.split('.');
      if (seg[1].length > 2) v = seg[0] + '.' + seg[1].slice(0, 2);
    }
    this.value = v;

    clearTimeout(state.calcTimer);
    state.calcTimer = setTimeout(calculate, 300);
  }

  function calculate() {
    var sen = UI.parseMoneyToSen(el.bill.value);
    if (!state.customer) return;
    if (sen === null || sen <= 0) {
      el.calcBox.style.display = 'none';
      el.redeemBtn.style.display = 'none';
      el.calcHint.textContent = '输入账单金额后自动计算 · Enter bill amount to calculate.';
      return;
    }
    API.staff.calculateWalletRedemption(state.customer.customerId, sen).then(function (res) {
      if (!res.success) { ADMIN.handleError(res.error); return; }
      state.calc = res.data;
      var d = res.data;
      document.getElementById('r10_calcBill').textContent   = UI.money(d.billAmount);
      document.getElementById('r10_calcWallet').textContent = UI.money(d.walletBalance);
      document.getElementById('r10_calcMax').textContent    = UI.money(d.maxUsable);
      document.getElementById('r10_calcPercent').textContent =
        '(' + d.maxPercent + '% · cap ' + UI.money(d.capAmount) + ')';
      document.getElementById('r10_calcPay').textContent    = UI.money(d.customerPays);
      el.calcBox.style.display = 'block';
      el.calcHint.style.display = 'none';

      if (d.usableAmount > 0) {
        el.redeemBtn.style.display = 'flex';
        el.redeemBtn.innerHTML = 'USE ' + UI.money(d.usableAmount) + ' · 确认抵扣';
      } else {
        el.redeemBtn.style.display = 'none';
        el.calcHint.style.display = 'block';
        el.calcHint.textContent = '无法抵扣：' + (d.reason || '不可用') + ' / Cannot redeem: ' + (d.reasonEn || 'not applicable');
      }
    });
  }

  function doRedeem() {
    if (!state.customer || !state.calc) return;
    var d = state.calc;

    UI.confirmDialog(
      '确认使用 ' + UI.money(d.usableAmount) + ' 钱包余额？',
      'Redeem ' + UI.money(d.usableAmount) + ' from wallet? Customer pays ' + UI.money(d.customerPays) + '.',
      '确认 CONFIRM'
    ).then(function (yes) {
      if (!yes) return;
      UI.showLoading('PROCESSING');
      API.staff.redeemWallet(
        state.customer.customerId,
        d.billAmount,
        d.usableAmount,
        '',
        'DIRECT',
        'Staff redemption'
      ).then(function (res) {
        UI.hideLoading();
        if (!res.success) { ADMIN.handleError(res.error); return; }
        UI.toast('抵扣完成 · 顾客应付 ' + UI.money(res.data.customerPays), 'success');
        state.customer = res.data.customer;
        renderDetail();
        loadHistory(state.customer.customerId);
      });
    });
  }

  /* ---------------- HISTORY ---------------- */

  function loadHistory(customerId) {
    API.staff.getCustomerHistory(customerId).then(function (res) {
      var box = document.getElementById('r10_cHistory');
      if (!res.success || !res.data.orders || !res.data.orders.length) {
        box.innerHTML = '<div class="a-empty">No visits yet / 还没有消费记录</div>';
        return;
      }
      box.innerHTML = '<div class="a-list">' + res.data.orders.map(function (o) {
        return '<div class="a-item">' +
          '<div class="a-main">' +
            '<div class="a-title">' + UI.money(o.amount) + '</div>' +
            '<div class="a-sub">' + UI.esc(o.source) +
              (o.externalOrderId ? ' · #' + UI.esc(o.externalOrderId) : '') +
              ' · ' + UI.esc(UI.dateTime(o.createdAt)) + '</div>' +
          '</div>' +
          '<div class="a-right">' +
            '<div class="a-value" style="color:var(--a-gold)">+' + UI.points(o.pointsEarned) + '</div>' +
            '<div class="a-meta">' +
              (o.rewardAmount ? 'RWD ' + UI.money(o.rewardAmount) : '') +
              (o.walletUsed ? ' · WLT -' + UI.money(o.walletUsed, false) : '') +
            '</div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    });
  }

  /* ---------------- MANAGER ADJUSTMENT ---------------- */

  function adjust(type) {
    if (!ADMIN.isManager()) { ADMIN.deny(); return; }
    var c = state.customer;
    if (!c) return;

    var isWallet = (type === 'wallet');
    var answer = window.prompt(
      isWallet
        ? 'Wallet adjustment (RM). Use - for deduction, e.g. -5.00\n钱包调整（RM），扣除请用负数，例如 -5.00'
        : 'Points adjustment. Use - for deduction, e.g. -50\n积分调整，扣除请用负数，例如 -50',
      isWallet ? '0.00' : '0'
    );
    if (answer === null) return;

    var amount;
    if (isWallet) {
      amount = UI.parseMoneyToSen(answer);
      if (amount === null || amount === 0) { UI.toast('Invalid amount / 金额无效', 'error'); return; }
    } else {
      amount = parseInt(answer, 10);
      if (isNaN(amount) || amount === 0) { UI.toast('Invalid points / 积分无效', 'error'); return; }
    }

    var reason = window.prompt('Reason 原因（会写入 Audit Log）', 'Manual adjustment') || '';

    UI.showLoading('PROCESSING');
    var p = isWallet
      ? API.admin.manualWalletAdjustment(c.customerId, amount, reason)
      : API.admin.manualPointAdjustment(c.customerId, amount, reason);

    p.then(function (res) {
      UI.hideLoading();
      if (!res.success) { ADMIN.handleError(res.error); return; }
      UI.toast('Adjusted / 已调整', 'success');
      state.customer = res.data.customer;
      renderDetail();
    });
  }

  return { init: init };
})();

/* =============================================================
   YETIPSY — admin-orders.js (Order / Transaction list)
   ============================================================= */

var ADMIN_ORDERS = (function () {

  var state = { status: 'ALL', keyword: '' };

  function init() {
    document.getElementById('r11_filterSeg').addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      Array.prototype.forEach.call(this.querySelectorAll('button'), function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      state.status = btn.getAttribute('data-status');
      load();
    });

    var kw = document.getElementById('r11_keywordInput');
    var timer;
    kw.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () {
        state.keyword = kw.value.trim();
        load();
      }, 320);
    });

    load();
  }

<script>

/* =============================================================================
   MOCK BACKEND（由 demo/server.js 自动产生，请勿手动修改）
   -----------------------------------------------------------------------------
   与 demo/server.js 使用完全相同的商业逻辑，只是把储存改成记忆体。
   ============================================================================= */
var MOCK_BACKEND = (function () {

  /* ---- 浏览器环境 shim（取代 Node 的 crypto / fs） ---- */
  function __mockHash(str) {
    var h1 = 0x811c9dc5, h2 = 0x01000193, i;
    for (i = 0; i < str.length; i++) {
      h1 ^= str.charCodeAt(i); h1 = (h1 * 16777619) >>> 0;
      h2 = (h2 + str.charCodeAt(i) * 31) >>> 0;
    }
    var out = '', a = h1, b = h2;
    for (i = 0; i < 8; i++) {
      out += ('0000000' + (a >>> 0).toString(16)).slice(-8);
      a = (a * 16777619 ^ b) >>> 0;
      b = (b * 2654435761 ^ i) >>> 0;
    }
    return out.slice(0, 64);
  }
  var crypto = {
    randomBytes: function (n) {
      var a = new Uint8Array(n), i;
      if (typeof window !== 'undefined' && window.crypto && window.crypto.getRandomValues) {
        window.crypto.getRandomValues(a);
      } else {
        for (i = 0; i < n; i++) a[i] = Math.floor(Math.random() * 256);
      }
      return {
        toString: function (enc) {
          if (enc === 'hex') {
            var s = '';
            for (var j = 0; j < a.length; j++) s += ('0' + a[j].toString(16)).slice(-2);
            return s;
          }
          return String.fromCharCode.apply(null, a);
        }
      };
    },
    createHash: function () {
      var buf = '';
      return {
        update: function (v) { buf += String(v); return this; },
        digest: function () { return __mockHash(buf); }
      };
    }
  };
  
const TIMEZONE = 'Asia/Kuala_Lumpur';

/* =============================================================================
   1. 资料存取
   ============================================================================= */

let DB = null;

function defaultSettings() {

}

function seed() {
  const now = new Date().toISOString();
  const db = {
    settings: defaultSettings(),
    seq: { customer: 0, order: 0, claim: 0, reward: 0, point: 0, wallet: 0, promo: 0, staff: 0, session: 0, audit: 0 },
    customers: [],
    orders: [],
    claims: [],
    rewards: [],

  };

  // ---- Demo staff（密码：yetipsy123） ----
  ['owner', 'manager', 'staff'].forEach((username, i) => {
    const salt = randomToken(8);
    db.staff.push({
      staffId:   'STF' + pad(++db.seq.staff, 4),
      username:  username,
      salt:      salt,
      passwordHash: hashPassword('yetipsy123', salt),
      role:      ['OWNER', 'MANAGER', 'STAFF'][i],

  // ---- Demo promotions ----
  db.promotions.push(

      'Claim your purchase and open tonight\'s mystery reward.\n认领消费即可打开今晚的神秘奖励。',
      daysFromNow(-10), daysFromNow(90)),
    promoObj(db, 'Weekend Warm-up', 'FRI — SUN',

function promoObj(db, title, subtitle, description, start, end) {
  return {
    promotionId: 'PRM' + pad(++db.seq.promo, 4),
    title, subtitle, description,
    imageUrl: '',
    startDate: start, endDate: end,
    minSpend: 0,
    status: 'ACTIVE',
    sortOrder: db.seq.promo,
    createdAt: new Date().toISOString()
  };
}

function daysFromNow(days) {
  const d = new Date(Date.now() + days * 86400000);
  return d.toISOString().slice(0, 10);
}

function load() {
  try {
    if (fs.existsSync(DATA_FILE)) {
      DB = JSON.parse(fs.readFileSync(DATA_FILE, 'utf8'));
      return;
    }
  } catch (e) {
    console.warn('[demo] data file unreadable, reseeding:', e.message);
  }
  DB = seed();
  save();
}

let saveTimer = null;
function save() {
  // 简易 debounce，避免频繁写盘
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { fs.writeFileSync(DATA_FILE, JSON.stringify(DB, null, 2)); }
    catch (e) { console.warn('[demo] save failed', e.message); }
  }, 60);
}

/* =============================================================================
   2. 工具
   ============================================================================= */

function pad(n, len) { return String(n).padStart(len, '0'); }

function randomToken(bytes) { return crypto.randomBytes(bytes || 24).toString('hex'); }

function sha256(str) {
  return crypto.createHash('sha256').update(String(str)).digest('hex');
}

function hashPassword(password, salt) { return sha256(salt + '|' + password + '|' + salt); }

function nowISO() { return new Date().toISOString(); }

/** Asia/Kuala_Lumpur 当天日期 YYYY-MM-DD */
function todayKey(offsetDays) {
  const d = new Date(Date.now() + (offsetDays || 0) * 86400000);
  return d.toLocaleDateString('en-CA', { timeZone: TIMEZONE }); // YYYY-MM-DD
}

function isoDateKey(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return d.toLocaleDateString('en-CA', { timeZone: TIMEZONE });
}

function nextId(prefix, key) {
  DB.seq[key] = (DB.seq[key] || 0) + 1;
  return prefix + pad(DB.seq[key], 6);
}

function setting(key, fallback) {
  const v = DB.settings[key];
  if (v === undefined || v === null || v === '') return fallback;
  return v;
}
function numSetting(key, fallback) {
  const v = Number(setting(key, fallback));
  return isFinite(v) ? v : fallback;
}
function boolSetting(key, fallback) {
  const v = String(setting(key, fallback ? 'TRUE' : 'FALSE')).toUpperCase();
  return v === 'TRUE' || v === '1' || v === 'YES';
}

function ok(data)          { return { success: true, data: data || {}, error: null }; }
function fail(code, msg)   { return { success: false, data: null, error: { code: code, message: msg || code } }; }

const ERR = {
  INVALID_SESSION:        ['INVALID_SESSION', 'Session expired. Please log in again. / 请重新登录。'],
  UNAUTHORIZED:           ['UNAUTHORIZED', 'You do not have permission. / 权限不足。'],

  INVALID_CLAIM_TOKEN:    ['INVALID_CLAIM_TOKEN', 'Invalid QR code. / 二维码无效。'],
  REWARD_NOT_FOUND:       ['REWARD_NOT_FOUND', 'Reward not found. / 找不到奖励。'],
  REWARD_ALREADY_CLAIMED: ['REWARD_ALREADY_CLAIMED', 'Reward already claimed. / 奖励已被领取。'],
  INSUFFICIENT_WALLET:    ['INSUFFICIENT_WALLET', 'Insufficient wallet balance. / 钱包余额不足。'],
  WALLET_LIMIT_EXCEEDED:  ['WALLET_LIMIT_EXCEEDED', 'Wallet usage exceeds the allowed limit. / 超出钱包可抵扣上限。'],
  CUSTOMER_NOT_FOUND:     ['CUSTOMER_NOT_FOUND', 'Member not found. / 找不到会员。'],
  INVALID_ROLE:           ['INVALID_ROLE', 'Invalid role. / 角色无效。'],
  RATE_LIMITED:           ['RATE_LIMITED', 'Too many attempts. Please wait. / 尝试次数过多，请稍后再试。'],
  STAFF_NOT_FOUND:        ['STAFF_NOT_FOUND', 'Staff account not found. / 找不到员工账号。'],
  USERNAME_TAKEN:         ['USERNAME_TAKEN', 'Username already exists. / 账号已存在。'],
  UNKNOWN_ACTION:         ['UNKNOWN_ACTION', 'Unknown action. / 未知的 API 动作。']
};
function err(key, customMessage) {
  const e = ERR[key] || ['UNKNOWN', 'Unknown error.'];
  return fail(e[0], customMessage || e[1]);
}

/* =============================================================================
   3. Session
   ============================================================================= */

const CUSTOMER_SESSION_HOURS = 24 * 30;
const STAFF_SESSION_HOURS    = 12;

function createSession(userType, userId) {
  const token = randomToken(32);                 // 64 hex chars
  const hours = userType === 'STAFF' ? STAFF_SESSION_HOURS : CUSTOMER_SESSION_HOURS;
  DB.sessions.push({
    sessionId: 'SES' + pad(++DB.seq.session, 6),
    userType: userType,
    userId: userId,
    tokenHash: sha256(token),                    // 只存 hash
    status: 'ACTIVE',
    createdAt: nowISO(),
    expiresAt: new Date(Date.now() + hours * 3600000).toISOString(),
    lastUsedAt: nowISO()
  });
  return token;
}

function getSession(token) {
  if (!token) return null;
  const hash = sha256(token);
  const s = DB.sessions.find(x => x.tokenHash === hash && x.status === 'ACTIVE');
  if (!s) return null;
  if (new Date(s.expiresAt).getTime() < Date.now()) {
    s.status = 'EXPIRED';
    return null;
  }
  s.lastUsedAt = nowISO();
  return s;
}

function destroySession(token) {
  const hash = sha256(token);
  const s = DB.sessions.find(x => x.tokenHash === hash);
  if (s) s.status = 'LOGGED_OUT';
}

function requireCustomer(token) {
  const s = getSession(token);
  if (!s) return { error: err('INVALID_SESSION') };
  if (s.userType !== 'CUSTOMER') return { error: err('INVALID_SESSION') };
  const c = DB.customers.find(x => x.customerId === s.userId);
  if (!c) return { error: err('INVALID_SESSION') };
  return { session: s, customer: c };
}

function requireStaff(token, roles) {
  const s = getSession(token);
  if (!s) return { error: err('INVALID_SESSION') };
  if (s.userType !== 'STAFF') return { error: err('INVALID_SESSION') };
  const st = DB.staff.find(x => x.staffId === s.userId);
  if (!st || st.status !== 'ACTIVE') return { error: err('INVALID_SESSION') };
  if (roles && roles.length && roles.indexOf(st.role) === -1) {
    return { error: err('UNAUTHORIZED', 'Manager or Owner permission required. / 需要经理或老板权限。') };
  }
  return { session: s, staff: st };
}

/* =============================================================================
   4. Audit Log
   ============================================================================= */

function audit(userId, userType, action, targetType, targetId, oldValue, newValue) {
  DB.audit.unshift({
    logId: 'LOG' + pad(++DB.seq.audit, 6),
    userId: userId || '',
    userType: userType || '',
    action: action,
    targetType: targetType || '',
    targetId: targetId || '',
    oldValue: oldValue === undefined ? '' : String(oldValue),
    newValue: newValue === undefined ? '' : String(newValue),
    createdAt: nowISO()
  });
  if (DB.audit.length > 3000) DB.audit.length = 3000;
}

/* =============================================================================
   5. Membership / Points / Tier
   ============================================================================= */

function computeTier(points) {
  const gold = numSetting('GOLD_THRESHOLD', 1500);
  const silver = numSetting('SILVER_THRESHOLD', 500);
  if (points >= gold) return 'GOLD';
  if (points >= silver) return 'SILVER';
  return 'MEMBER';
}

function membershipInfo(customer) {
  const p = customer.currentPoints || 0;
  const silver = numSetting('SILVER_THRESHOLD', 500);
  const gold   = numSetting('GOLD_THRESHOLD', 1500);
  const tier   = computeTier(p);

  let nextTier = '', pointsToNext = 0, floor = 0, ceiling = 0;
  if (p < silver)      { nextTier = 'SILVER'; floor = 0;      ceiling = silver; }
  else if (p < gold)   { nextTier = 'GOLD';   floor = silver; ceiling = gold;   }
  else                 { nextTier = '';       floor = gold;   ceiling = gold;   }

  pointsToNext = nextTier ? Math.max(0, ceiling - p) : 0;
  const progressPercent = nextTier
    ? Math.min(100, Math.round(((p - floor) / Math.max(1, ceiling - floor)) * 100))
    : 100;

  return {
    tier, currentPoints: p, nextTier, pointsToNext, progressPercent,
    thresholds: { MEMBER: numSetting('MEMBER_THRESHOLD', 0), SILVER: silver, GOLD: gold },
    lifetimePoints: customer.lifetimePoints || 0
  };
}

function issuePoints(customer, order, points, description, actorId, actorType) {
  if (!points) return null;
  const before = customer.currentPoints || 0;
  const after  = Math.max(0, before + points);
  customer.currentPoints = after;
  if (points > 0) customer.lifetimePoints = (customer.lifetimePoints || 0) + points;
  customer.membershipTier = computeTier(after);

  DB.pointTx.unshift({
    transactionId: 'PTS' + pad(++DB.seq.point, 6),
    customerId: customer.customerId,
    orderId: order ? order.orderId : '',
    type: points >= 0 ? 'EARN' : 'ADJUSTMENT',
    points: points,
    balanceBefore: before,
    balanceAfter: after,
    description: description || '',
    createdAt: nowISO(),
    createdBy: actorId || ''
  });
  audit(actorId, actorType || 'SYSTEM', 'ISSUE_POINTS', 'CUSTOMER', customer.customerId, before, after);
  return { before, after };
}

function walletCredit(customer, order, amountSen, type, description, actorId, actorType) {
  const before = customer.walletBalance || 0;
  const after  = Math.max(0, before + amountSen);
  customer.walletBalance = after;
  DB.walletTx.unshift({
    transactionId: 'WLT' + pad(++DB.seq.wallet, 6),
    customerId: customer.customerId,
    orderId: order ? order.orderId : '',
    type: type,
    amount: amountSen,
    balanceBefore: before,
    balanceAfter: after,
    description: description || '',
    createdAt: nowISO(),
    createdBy: actorId || ''
  });
  audit(actorId, actorType || 'SYSTEM', type === 'REWARD' ? 'CLAIM_REWARD' : 'MANUAL_WALLET_ADJUST',
        'CUSTOMER', customer.customerId, before, after);
  return { before, after };
}

/* =============================================================================
   6. Reward Engine（后端生成，禁止前端 Math.random）
   ============================================================================= */

function rewardBand(amountSen) {
  let tiers;
  try { tiers = JSON.parse(setting('REWARD_TIERS', '[]')); }
  catch (e) { tiers = []; }
  const hit = tiers.find(t => amountSen >= t.min && amountSen <= t.max);
  return hit || null;
}

function rewardsGivenToday() {
  const today = todayKey();
  return DB.rewards
    .filter(r => r.status !== 'CANCELLED' && isoDateKey(r.createdAt) === today)
    .reduce((sum, r) => sum + r.amount, 0);
}

function generateReward(customer, order, amountSen) {
  if (!boolSetting('REWARD_ENABLED', true)) return null;
  if (amountSen < numSetting('REWARD_MIN_SPEND', 30) * 100) return null;

  const band = rewardBand(amountSen);
  if (!band) return null;

  const budget = numSetting('DAILY_REWARD_BUDGET', 50) * 100;
  const used   = rewardsGivenToday();
  const left   = budget - used;
  if (left <= 0) return null;                       // 预算用尽

  // 加权随机：70% small / 25% medium / 5% big
  let weights;
  try { weights = JSON.parse(setting('REWARD_WEIGHTS', '{"small":70,"medium":25,"big":5}')); }
  catch (e) { weights = { small: 70, medium: 25, big: 5 }; }

  const roll = Math.random() * 100;
  const range = band.to - band.from;
  let amount;
  if (roll < (weights.small || 70)) {
    amount = band.from + Math.round(Math.random() * range * 0.30);
  } else if (roll < (weights.small || 70) + (weights.medium || 25)) {
    amount = band.from + Math.round(range * 0.30 + Math.random() * range * 0.40);
  } else {
    amount = band.from + Math.round(range * 0.70 + Math.random() * range * 0.30);
  }

  // 预算接近上限 → LOW_REWARD_MODE
  const lowModeThreshold = budget * 0.8;
  if (used + amount > lowModeThreshold) {
    amount = Math.min(amount, numSetting('LOW_REWARD_MODE_MAX', 100));
  }
  amount = Math.max(10, Math.min(amount, left));    // 至少 RM0.10，且不超过剩余预算
  amount = Math.round(amount);

  const reward = {
    rewardId: 'RWD' + pad(++DB.seq.reward, 6),
    orderId: order ? order.orderId : '',
    customerId: customer ? customer.customerId : '',
    amount: amount,
    status: 'AVAILABLE',
    createdAt: nowISO(),
    expiresAt: new Date(Date.now() + 7 * 86400000).toISOString(),
    claimedAt: ''
  };
  DB.rewards.unshift(reward);
  audit('SYSTEM', 'SYSTEM', 'ISSUE_REWARD', 'REWARD', reward.rewardId, '', amount);
  return reward;
}

   ============================================================================= */

function findOrderByExternal(source, externalOrderId) {
  if (!externalOrderId) return null;
  const key = String(externalOrderId).trim().toUpperCase();
  return DB.orders.find(o =>
    o.orderSource === source &&
    String(o.externalOrderId || '').trim().toUpperCase() === key &&
    o.orderStatus !== 'CANCELLED' &&
    o.orderStatus !== 'VOID'
  ) || null;
}

/**
 * 建立「已验证会员消费记录」。
 * 来源可以是 FOODCOURT（员工手动）/ DIRECT / 未来 FOODCOURT_API / YETIPSY_APP / IMPORT
 */
function createMemberTransaction(opts) {
  const order = {
    orderId: 'YTORD' + pad(++DB.seq.order, 6),
    externalOrderId: opts.externalOrderId || '',
    orderSource: opts.source || 'DIRECT',
    billAmount: opts.amount,
    customerId: opts.customerId || '',
    claimStatus: opts.customerId ? 'CLAIMED' : 'AVAILABLE',
    pointsEarned: 0,
    rewardAmount: 0,
    rewardId: '',
    walletUsed: 0,
    finalAmount: opts.amount,
    orderStatus: 'ACTIVE',
    createdBy: opts.createdBy || '',
    note: opts.note || '',
    createdAt: nowISO(),
    claimedAt: opts.customerId ? nowISO() : '',
    completedAt: opts.customerId ? nowISO() : ''
  };
  DB.orders.unshift(order);
  audit(opts.createdBy, opts.actorType || 'STAFF', 'CREATE_ORDER', 'ORDER', order.orderId, '', opts.amount);
  return order;
}

function generateClaimCode() {
  const alphabet = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉易混淆字符
  let code;
  let guard = 0;
  do {
    let out = '';
    for (let i = 0; i < 4; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
    code = out;
    guard++;
  } while (DB.claims.some(c => c.claimCode === code && c.status === 'AVAILABLE') && guard < 50);
  return code;
}

function createClaimForOrder(order, actorId, actorType) {
  const token = randomToken(32);
  const expiryHours = numSetting('CLAIM_EXPIRY_HOURS', 24);
  const claim = {
    claimId: 'CLM' + pad(++DB.seq.claim, 6),
    orderId: order.orderId,
    claimTokenHash: sha256(token),
    claimCode: generateClaimCode(),
    status: 'AVAILABLE',
    customerId: '',
    expiresAt: new Date(Date.now() + expiryHours * 3600000).toISOString(),
    createdAt: nowISO(),
    claimedAt: '',
    createdBy: actorId || ''
  };
  DB.claims.unshift(claim);
  audit(actorId, actorType || 'STAFF', 'CREATE_CLAIM', 'CLAIM', claim.claimId, '', order.billAmount);
  return { claim, token };
}

handlers.customerLogin = function (data) {
  let phone = String(data.phone || '').replace(/[^0-9]/g, '');
  if (phone.indexOf('60') === 0) phone = phone.slice(2);
  else if (phone.indexOf('0') === 0) phone = phone.slice(1);
  if (phone.length < 8 || phone.length > 12) return err('INVALID_PHONE');
  phone = '+60' + phone;

  const name = String(data.name || '').trim().slice(0, 40);
  let customer = DB.customers.find(c => c.phone === phone);
  let isNew = false;

  if (!customer) {
    customer = {
      customerId: 'YT' + pad(++DB.seq.customer, 6),
      phone: phone,
      name: name,
      birthday: '',
      currentPoints: 0,
      lifetimePoints: 0,
      walletBalance: 0,
      membershipTier: 'MEMBER',
      totalSpend: 0,
      totalVisits: 0,
      totalRewards: 0,
      status: 'ACTIVE',
      createdAt: nowISO(),
      lastVisitAt: ''
    };
    DB.customers.push(customer);
    isNew = true;
    audit(customer.customerId, 'CUSTOMER', 'CUSTOMER_REGISTER', 'CUSTOMER', customer.customerId, '', phone);
  } else if (name && !customer.name) {
    customer.name = name;
  }

  const token = createSession('CUSTOMER', customer.customerId);
  audit(customer.customerId, 'CUSTOMER', 'LOGIN', 'CUSTOMER', customer.customerId, '', '');
  save();
  return ok({ token, customer: publicCustomer(customer), isNewCustomer: isNew });
};

/* ---------------- CLAIM ---------------- */

function claimView(claim, order, includeToken) {
  const view = {
    claimId: claim.claimId,
    claimCode: claim.claimCode,
    orderId: claim.orderId,
    externalOrderId: order ? order.externalOrderId : '',
    source: order ? order.orderSource : '',
    status: claim.status,
    amount: order ? order.billAmount : 0,
    createdAt: claim.createdAt,
    expiresAt: claim.expiresAt
  };
  if (includeToken) view.token = includeToken;
  return view;
}

handlers.getClaimByToken = function (data, token) {
  const ctx = requireCustomer(token);
  if (ctx.error) return ctx.error;

  const raw = String(data.token || '');
  if (!raw) return err('INVALID_CLAIM_TOKEN');
  const hash = sha256(raw);
  const claim = DB.claims.find(c => c.claimTokenHash === hash);
  if (!claim) return err('INVALID_CLAIM_TOKEN');

  const order = DB.orders.find(o => o.orderId === claim.orderId);
  if (!order) return err('ORDER_NOT_FOUND');

  if (claim.status === 'CLAIMED')  return err('CLAIM_ALREADY_USED');
  if (claim.status === 'CANCELLED') return err('CLAIM_NOT_FOUND');
  if (claim.status === 'EXPIRED' || new Date(claim.expiresAt).getTime() < Date.now()) {
    if (claim.status === 'AVAILABLE') claim.status = 'EXPIRED';
    save();
    return err('CLAIM_EXPIRED');
  }

  return ok({ claim: claimView(claim, order, raw) });
};

handlers.getClaimByCode = function (data, token) {
  const ctx = requireCustomer(token);
  if (ctx.error) return ctx.error;

  const code = String(data.code || '').trim().toUpperCase();
  if (!code) return err('CLAIM_NOT_FOUND');
  const claim = DB.claims.find(c => c.claimCode === code);
  if (!claim) return err('CLAIM_NOT_FOUND');

  const order = DB.orders.find(o => o.orderId === claim.orderId);
  if (!order) return err('ORDER_NOT_FOUND');

  if (claim.status === 'CLAIMED')   return err('CLAIM_ALREADY_USED');
  if (claim.status === 'CANCELLED') return err('CLAIM_NOT_FOUND');
  if (claim.status === 'EXPIRED' || new Date(claim.expiresAt).getTime() < Date.now()) {
    if (claim.status === 'AVAILABLE') claim.status = 'EXPIRED';
    save();
    return err('CLAIM_EXPIRED');
  }

  return ok({ claim: claimView(claim, order, '') });
};

handlers.claimOrder = function (data, token) {
  const ctx = requireCustomer(token);
  if (ctx.error) return ctx.error;
  const customer = ctx.customer;

  const raw = String(data.token || '');
  const code = String(data.code || '').trim().toUpperCase();

  let claim = null;
  if (raw) {
    claim = DB.claims.find(c => c.claimTokenHash === sha256(raw));
  } else if (code) {
    claim = DB.claims.find(c => c.claimCode === code);
  }
  if (!claim) return err('INVALID_CLAIM_TOKEN');

  // 幂等：同一 claim 只能成功一次
  if (claim.status === 'CLAIMED')   return err('CLAIM_ALREADY_USED');
  if (claim.status === 'CANCELLED') return err('CLAIM_NOT_FOUND');
  if (claim.status === 'EXPIRED' || new Date(claim.expiresAt).getTime() < Date.now()) {
    claim.status = 'EXPIRED';
    save();
    return err('CLAIM_EXPIRED');
  }

  const order = DB.orders.find(o => o.orderId === claim.orderId);
  if (!order) return err('ORDER_NOT_FOUND');
  if (order.claimStatus === 'CLAIMED') {
    claim.status = 'CLAIMED';
    save();
    return err('CLAIM_ALREADY_USED');
  }

  /* ---- 写入（生产环境由 LockService 保证原子性） ---- */
  claim.status = 'CLAIMED';
  claim.customerId = customer.customerId;
  claim.claimedAt = nowISO();

  order.customerId   = customer.customerId;
  order.claimStatus  = 'CLAIMED';
  order.claimedAt    = nowISO();
  order.completedAt  = nowISO();
  order.finalAmount  = order.billAmount - (order.walletUsed || 0);

  customer.totalSpend  = (customer.totalSpend || 0) + order.billAmount;
  customer.totalVisits = (customer.totalVisits || 0) + 1;
  customer.lastVisitAt = nowISO();

  // Points（NET_PAID：钱包抵扣不能重复产生积分）
  const perRm = numSetting('POINTS_PER_RM', 1);
  const basis = setting('POINTS_CALCULATION', 'NET_PAID') === 'GROSS_BILL'
    ? order.billAmount
    : Math.max(0, order.billAmount - (order.walletUsed || 0));
  const points = Math.floor((basis / 100) * perRm);
  order.pointsEarned = points;
  issuePoints(customer, order, points, 'Claim ' + (order.externalOrderId || order.orderId),
              customer.customerId, 'CUSTOMER');

  audit(customer.customerId, 'CUSTOMER', 'CLAIM_ORDER', 'ORDER', order.orderId, 'AVAILABLE', 'CLAIMED');

  // Reward（后端生成）
  const reward = generateReward(customer, order, order.billAmount);

  save();
  return ok({
    orderId: order.orderId,
    amount: order.billAmount,
    pointsEarned: points,
    customer: publicCustomer(customer),
    membership: membershipInfo(customer),
    reward: reward ? { rewardId: reward.rewardId, status: reward.status } : null
  });
};

handlers.getPendingReward = function (data, token) {
  const ctx = requireCustomer(token);
  if (ctx.error) return ctx.error;

  const id = String(data.rewardId || '');
  const list = DB.rewards.filter(r =>
    r.customerId === ctx.customer.customerId && r.status === 'AVAILABLE');

  const reward = id ? list.find(r => r.rewardId === id) : list[0];
  if (!reward) return ok({ reward: null });

  const order = DB.orders.find(o => o.orderId === reward.orderId);
  return ok({
    reward: {
      rewardId: reward.rewardId,
      status: reward.status,
      createdAt: reward.createdAt,
      expiresAt: reward.expiresAt,
      orderInfo: order
        ? { externalOrderId: order.externalOrderId, amountText: 'RM ' + (order.billAmount / 100).toFixed(2) }
        : null
    }
  });
};

handlers.claimReward = function (data, token) {
  const ctx = requireCustomer(token);
  if (ctx.error) return ctx.error;
  const customer = ctx.customer;

  const rewardId = String(data.rewardId || '');
  const reward = DB.rewards.find(r => r.rewardId === rewardId);
  if (!reward) return err('REWARD_NOT_FOUND');
  if (reward.customerId !== customer.customerId) return err('REWARD_NOT_FOUND');
  if (reward.status === 'CLAIMED') return err('REWARD_ALREADY_CLAIMED');   // 幂等
  if (reward.status !== 'AVAILABLE') return err('REWARD_NOT_FOUND');
  if (reward.expiresAt && new Date(reward.expiresAt).getTime() < Date.now()) {
    reward.status = 'EXPIRED';
    save();
    return err('REWARD_NOT_FOUND');
  }

  reward.status = 'CLAIMED';
  reward.claimedAt = nowISO();

  const order = DB.orders.find(o => o.orderId === reward.orderId);
  if (order) order.rewardAmount = reward.amount;
  if (order) order.rewardId = reward.rewardId;

  walletCredit(customer, order, reward.amount, 'REWARD',
               'Reward from ' + (order ? (order.externalOrderId || order.orderId) : 'Yetipsy'),
               customer.customerId, 'CUSTOMER');
  customer.totalRewards = (customer.totalRewards || 0) + 1;

  audit(customer.customerId, 'CUSTOMER', 'CLAIM_REWARD', 'REWARD', reward.rewardId, '', reward.amount);
  save();

  return ok({
    rewardId: reward.rewardId,
    amount: reward.amount,
    walletBalance: customer.walletBalance,

const loginAttempts = {};   // 简易 rate limit

handlers.staffLogin = function (data) {
  const username = String(data.username || '').trim().toLowerCase();
  const password = String(data.password || '');
  if (!username || !password) return err('UNAUTHORIZED', 'Invalid username or password. / 账号或密码错误。');

  // Rate limit：同一账号连续失败 6 次 → 锁定 5 分钟
  const key = username;
  const rec = loginAttempts[key] || { count: 0, until: 0 };
  if (rec.until && Date.now() < rec.until) return err('RATE_LIMITED');

  const staff = DB.staff.find(s => s.username.toLowerCase() === username);
  if (!staff || staff.status !== 'ACTIVE' || staff.passwordHash !== hashPassword(password, staff.salt)) {
    rec.count++;
    if (rec.count >= 6) rec.until = Date.now() + 5 * 60000;
    loginAttempts[key] = rec;
    return err('UNAUTHORIZED', 'Invalid username or password. / 账号或密码错误。');
  }

  loginAttempts[key] = { count: 0, until: 0 };
  staff.lastLogin = nowISO();
  const token = createSession('STAFF', staff.staffId);
  audit(staff.staffId, 'STAFF', 'LOGIN', 'STAFF', staff.staffId, '', staff.role);
  save();
  return ok({
    token,
    staff: { staffId: staff.staffId, username: staff.username, role: staff.role, name: staff.username }
  });
};

handlers.getDashboard = function (data, token) {
  const ctx = requireStaff(token);
  if (ctx.error) return ctx.error;

  const today = todayKey();
  const todays = DB.orders.filter(o => isoDateKey(o.createdAt) === today && o.orderStatus !== 'CANCELLED');
  const claimed = todays.filter(o => o.claimStatus === 'CLAIMED');

  const claims = DB.claims.filter(c => isoDateKey(c.createdAt) === today);
  const newMembers = DB.customers.filter(c => isoDateKey(c.createdAt) === today);

  const pointsIssued = DB.pointTx
    .filter(t => isoDateKey(t.createdAt) === today && t.type === 'EARN')
    .reduce((s, t) => s + t.points, 0);

  const rewardsGiven = DB.rewards
    .filter(r => isoDateKey(r.createdAt) === today && r.status !== 'CANCELLED')
    .reduce((s, r) => s + r.amount, 0);

  const walletRedeemed = DB.walletTx
    .filter(t => isoDateKey(t.createdAt) === today && t.type === 'REDEEM')
    .reduce((s, t) => s + Math.abs(t.amount), 0);

  const budget = numSetting('DAILY_REWARD_BUDGET', 50) * 100;

  const recentClaims = DB.claims.slice(0, 8).map(c => {
    const o = DB.orders.find(x => x.orderId === c.orderId);
    const cust = c.customerId ? DB.customers.find(x => x.customerId === c.customerId) : null;
    return {
      claimId: c.claimId,
      orderId: c.orderId,
      externalOrderId: o ? o.externalOrderId : '',
      source: o ? o.orderSource : '',
      amount: o ? o.billAmount : 0,
      claimCode: c.claimCode,
      status: c.status,
      createdAt: c.createdAt,
      customerName: cust ? cust.name : ''
    };
  });

  return ok({
    date: today,
    sales: todays.reduce((s, o) => s + o.billAmount, 0),
    memberSales: claimed.reduce((s, o) => s + o.billAmount, 0),
    orderCount: todays.length,
    claims: claims.filter(c => c.status === 'CLAIMED').length,
    claimsPending: claims.filter(c => c.status === 'AVAILABLE').length,
    claimsExpired: claims.filter(c => c.status === 'EXPIRED').length,
    newMembers: newMembers.length,
    pointsIssued: pointsIssued,
    rewardsGiven: rewardsGiven,
    rewardBudget: budget,
    rewardBudgetLeft: Math.max(0, budget - rewardsGiven),
    lowRewardMode: rewardsGiven >= budget * 0.8,
    walletRedeemed: walletRedeemed,
    recentClaims: recentClaims
  });
};

handlers.createClaim = function (data, token) {
  const ctx = requireStaff(token);
  if (ctx.error) return ctx.error;

  const source = String(data.source || 'FOODCOURT').toUpperCase();
  if (['FOODCOURT', 'DIRECT', 'YETIPSY_APP', 'MANUAL'].indexOf(source) === -1) {
    return err('INVALID_INPUT', 'Invalid order source. / 来源无效。');
  }

  const externalOrderId = String(data.externalOrderId || '').trim().toUpperCase().slice(0, 30);
  const amount = Math.round(Number(data.amount));

  if (!isFinite(amount) || amount <= 0) return err('INVALID_AMOUNT');
  if (amount > 100000000) return err('INVALID_AMOUNT', 'Amount too large. / 金额过大。');
  if (source === 'FOODCOURT' && !externalOrderId) {
    return err('INVALID_INPUT', 'Order number required. / 请输入订单号码。');
  }
  if (source !== 'DIRECT' && externalOrderId) {
    // 防止重复创建积分
    if (findOrderByExternal(source, externalOrderId)) return err('DUPLICATE_EXTERNAL_ORDER');
  }

  const order = createMemberTransaction({
    source: source,
    externalOrderId: externalOrderId,
    amount: amount,
    createdBy: ctx.staff.staffId,
    actorType: 'STAFF',
    note: String(data.note || '').slice(0, 200)
  });

  const { claim, token: claimToken } = createClaimForOrder(order, ctx.staff.staffId, 'STAFF');
  save();

  return ok({
    claimId: claim.claimId,
    orderId: order.orderId,
    externalOrderId: order.externalOrderId,
    source: order.orderSource,
    amount: order.billAmount,
    token: claimToken,
    claimCode: claim.claimCode,
    expiresAt: claim.expiresAt,
    createdAt: claim.createdAt
  });
};

handlers.cancelClaim = function (data, token) {
  const ctx = requireStaff(token);
  if (ctx.error) return ctx.error;

  const claim = DB.claims.find(c => c.claimId === String(data.claimId || ''));
  if (!claim) return err('CLAIM_NOT_FOUND');
  if (claim.status !== 'AVAILABLE') {
    return err('CLAIM_ALREADY_USED', 'Only available claims can be cancelled. / 只能取消未认领的 Claim。');
  }

  claim.status = 'CANCELLED';
  const order = DB.orders.find(o => o.orderId === claim.orderId);
  if (order) { order.orderStatus = 'CANCELLED'; order.claimStatus = 'CANCELLED'; }

  audit(ctx.staff.staffId, 'STAFF', 'CANCEL_ORDER', 'CLAIM', claim.claimId, 'AVAILABLE', 'CANCELLED');
  save();
  return ok({ claimId: claim.claimId, status: 'CANCELLED' });
};

handlers.searchCustomer = function (data, token) {
  const ctx = requireStaff(token);
  if (ctx.error) return ctx.error;

  const kw = String(data.keyword || '').trim();
  if (kw.length < 3) return ok({ customers: [] });

  const kwLower = kw.toLowerCase();
  const kwDigits = kw.replace(/[^0-9]/g, '');

  const list = DB.customers.filter(c => {
    if (c.customerId.toLowerCase() === kwLower) return true;
    if (c.phone.indexOf(kwDigits) !== -1 && kwDigits.length >= 3) return true;
    if (c.name && c.name.toLowerCase().indexOf(kwLower) !== -1) return true;
    return false;
  }).slice(0, 20);

  return ok({
    customers: list.map(c => ({
      customerId: c.customerId, name: c.name, phone: c.phone,
      currentPoints: c.currentPoints, walletBalance: c.walletBalance,
      membershipTier: c.membershipTier, totalSpend: c.totalSpend, totalVisits: c.totalVisits

  });
};

handlers.calculateWalletRedemption = function (data, token) {
  const ctx = requireStaff(token);
  if (ctx.error) return ctx.error;

  const c = DB.customers.find(x => x.customerId === String(data.customerId || ''));
  if (!c) return err('CUSTOMER_NOT_FOUND');

  const bill = Math.round(Number(data.billAmount));
  if (!isFinite(bill) || bill <= 0) return err('INVALID_AMOUNT');

  const percent = numSetting('MAX_WALLET_USAGE_PERCENT', 20);
  const minBill = numSetting('MIN_WALLET_REDEEM_BILL', 30) * 100;
  const wallet  = c.walletBalance || 0;

  const capAmount  = Math.floor(bill * percent / 100);
  const maxUsable  = Math.min(wallet, capAmount);
  const usable     = maxUsable;

  let reason = '', reasonEn = '';
  if (bill < minBill) {
    reason = '账单未满 RM' + (minBill / 100).toFixed(2);
    reasonEn = 'bill below minimum RM' + (minBill / 100).toFixed(2);
  } else if (wallet <= 0) {
    reason = '钱包没有余额'; reasonEn = 'no wallet balance';
  }

  return ok({
    billAmount: bill,
    walletBalance: wallet,
    maxPercent: percent,
    capAmount: capAmount,
    maxUsable: maxUsable,
    usableAmount: bill < minBill ? 0 : usable,
    customerPays: bill - (bill < minBill ? 0 : usable),
    minBill: minBill,
    reason: reason,
    reasonEn: reasonEn,
    allowed: bill >= minBill && usable > 0
  });
};

handlers.redeemWallet = function (data, token) {
  const ctx = requireStaff(token);
  if (ctx.error) return ctx.error;

  const c = DB.customers.find(x => x.customerId === String(data.customerId || ''));
  if (!c) return err('CUSTOMER_NOT_FOUND');

  const bill = Math.round(Number(data.billAmount));
  const requested = Math.round(Number(data.walletAmount));
  if (!isFinite(bill) || bill <= 0) return err('INVALID_AMOUNT');
  if (!isFinite(requested) || requested < 0) return err('INVALID_AMOUNT');

  const percent = numSetting('MAX_WALLET_USAGE_PERCENT', 20);
  const minBill = numSetting('MIN_WALLET_REDEEM_BILL', 30) * 100;
  const wallet  = c.walletBalance || 0;

  if (bill < minBill) {
    return err('WALLET_LIMIT_EXCEEDED',
      'Bill must be at least RM' + (minBill / 100).toFixed(2) + '. / 账单需满 RM' + (minBill / 100).toFixed(2) + '。');
  }
  if (requested > wallet) return err('INSUFFICIENT_WALLET');

  const cap = Math.floor(bill * percent / 100);
  if (requested > cap) return err('WALLET_LIMIT_EXCEEDED');

  const source = String(data.source || 'DIRECT').toUpperCase();
  const externalOrderId = String(data.externalOrderId || '').trim().toUpperCase();
  if (externalOrderId && findOrderByExternal(source, externalOrderId)) return err('DUPLICATE_EXTERNAL_ORDER');

  /* ---- 建立已验证会员消费记录（钱包抵扣由员工确认） ---- */
  const order = createMemberTransaction({
    source: source,
    externalOrderId: externalOrderId,
    amount: bill,
    customerId: c.customerId,
    createdBy: ctx.staff.staffId,
    actorType: 'STAFF',
    note: String(data.note || '').slice(0, 200)
  });

  order.walletUsed   = requested;
  order.finalAmount  = bill - requested;
  order.claimStatus  = 'CLAIMED';
  order.claimedAt    = nowISO();
  order.completedAt  = nowISO();

  // 钱包扣款
  walletCredit(c, order, -requested, 'REDEEM',
    'Redemption for ' + (externalOrderId || order.orderId), ctx.staff.staffId, 'STAFF');
  audit(ctx.staff.staffId, 'STAFF', 'REDEEM_WALLET', 'ORDER', order.orderId, wallet, wallet - requested);

  // 积分（NET_PAID）
  const perRm = numSetting('POINTS_PER_RM', 1);
  const basis = setting('POINTS_CALCULATION', 'NET_PAID') === 'GROSS_BILL' ? bill : (bill - requested);
  const points = Math.floor((basis / 100) * perRm);
  order.pointsEarned = points;

  c.totalSpend  = (c.totalSpend || 0) + bill;
  c.totalVisits = (c.totalVisits || 0) + 1;
  c.lastVisitAt = nowISO();
  issuePoints(c, order, points, 'Purchase with wallet redemption', ctx.staff.staffId, 'STAFF');

  const reward = generateReward(c, order, bill);
  save();

  return ok({
    orderId: order.orderId,
    billAmount: bill,
    walletUsed: requested,
    customerPays: bill - requested,
    pointsEarned: points,
    customer: {
      customerId: c.customerId, name: c.name, phone: c.phone,
      currentPoints: c.currentPoints, walletBalance: c.walletBalance,
      membershipTier: c.membershipTier, totalSpend: c.totalSpend,
      totalVisits: c.totalVisits, totalRewards: c.totalRewards
    },
    membership: membershipInfo(c),
    reward: reward ? { rewardId: reward.rewardId, status: reward.status } : null
  });
};

handlers.getOrders = function (data, token) {

  const status = String(data.status || '').toUpperCase();
  const kw = String(data.keyword || '').trim().toUpperCase();

  let list = DB.orders.slice();
  if (status === 'CLAIMED')     list = list.filter(o => o.claimStatus === 'CLAIMED');
  else if (status === 'PENDING') list = list.filter(o => o.claimStatus === 'AVAILABLE');
  else if (status === 'CANCELLED') list = list.filter(o => o.orderStatus === 'CANCELLED' || o.orderStatus === 'VOID');
  else if (status) list = list.filter(o => o.claimStatus === status);

  if (kw) {
    list = list.filter(o =>
      String(o.externalOrderId || '').toUpperCase().indexOf(kw) !== -1 ||
      o.orderId.toUpperCase().indexOf(kw) !== -1);
  }

  list = list.slice(0, limit);
  return ok({
    orders: list.map(o => {
      const cust = o.customerId ? DB.customers.find(c => c.customerId === o.customerId) : null;
      return {
        orderId: o.orderId, externalOrderId: o.externalOrderId, source: o.orderSource,
        amount: o.billAmount, pointsEarned: o.pointsEarned, rewardAmount: o.rewardAmount,
        walletUsed: o.walletUsed, finalAmount: o.finalAmount,

      };

handlers.cancelOrder = function (data, token) {
  const ctx = requireStaff(token, ['MANAGER', 'OWNER']);
  if (ctx.error) return ctx.error;

  const order = DB.orders.find(o => o.orderId === String(data.orderId || ''));
  if (!order) return err('ORDER_NOT_FOUND');
  if (order.orderStatus === 'CANCELLED') return err('ORDER_NOT_FOUND', 'Order already cancelled. / 订单已取消。');

  const customer = order.customerId ? DB.customers.find(c => c.customerId === order.customerId) : null;

  order.orderStatus = 'CANCELLED';
  order.claimStatus = 'CANCELLED';

  const claim = DB.claims.find(c => c.orderId === order.orderId);
  if (claim && claim.status === 'AVAILABLE') claim.status = 'CANCELLED';

  if (customer) {
    // 撤销积分
    if (order.pointsEarned) {
      issuePoints(customer, order, -order.pointsEarned, 'Reversal of ' + order.orderId,
                  ctx.staff.staffId, 'STAFF');
      const tx = DB.pointTx[0];
      if (tx) tx.type = 'REVERSAL';
    }
    // 撤销消费与到店次数
    customer.totalSpend  = Math.max(0, (customer.totalSpend || 0) - order.billAmount);
    customer.totalVisits = Math.max(0, (customer.totalVisits || 0) - 1);
    // 撤销已领取的奖励
    const reward = DB.rewards.find(r => r.orderId === order.orderId && r.status === 'CLAIMED');
    if (reward) {
      reward.status = 'CANCELLED';
      walletCredit(customer, order, -reward.amount, 'REVERSAL', 'Reversal of reward ' + reward.rewardId,
                   ctx.staff.staffId, 'STAFF');
      customer.totalRewards = Math.max(0, (customer.totalRewards || 0) - 1);
    }
    const pending = DB.rewards.find(r => r.orderId === order.orderId && r.status === 'AVAILABLE');
    if (pending) pending.status = 'CANCELLED';
  }

  audit(ctx.staff.staffId, 'STAFF', 'CANCEL_ORDER', 'ORDER', order.orderId, 'ACTIVE',
        'CANCELLED: ' + String(data.reason || '').slice(0, 100));
  save();
  return ok({ orderId: order.orderId, status: 'CANCELLED' });
};

handlers.manualPointAdjustment = function (data, token) {
  const ctx = requireStaff(token, ['MANAGER', 'OWNER']);
  if (ctx.error) return ctx.error;

  const c = DB.customers.find(x => x.customerId === String(data.customerId || ''));
  if (!c) return err('CUSTOMER_NOT_FOUND');

  const points = Math.round(Number(data.points));
  if (!isFinite(points) || points === 0) return err('INVALID_AMOUNT');
  if (points < 0 && Math.abs(points) > (c.currentPoints || 0)) {
    return err('INVALID_AMOUNT', 'Adjustment exceeds current points. / 调整超过现有积分。');
  }

  const reason = String(data.reason || '').slice(0, 200);
  const before = c.currentPoints || 0;
  c.currentPoints = Math.max(0, before + points);
  if (points > 0) c.lifetimePoints = (c.lifetimePoints || 0) + points;
  c.membershipTier = computeTier(c.currentPoints);

  DB.pointTx.unshift({
    transactionId: 'PTS' + pad(++DB.seq.point, 6),
    customerId: c.customerId, orderId: '',
    type: 'ADJUSTMENT', points: points,
    balanceBefore: before, balanceAfter: c.currentPoints,
    description: reason || 'Manual adjustment',
    createdAt: nowISO(), createdBy: ctx.staff.staffId
  });
  audit(ctx.staff.staffId, 'STAFF', 'POINT_ADJUST', 'CUSTOMER', c.customerId, before, c.currentPoints + ' | ' + reason);
  save();
  return ok({
    customer: {
      customerId: c.customerId, name: c.name, phone: c.phone,
      currentPoints: c.currentPoints, walletBalance: c.walletBalance,
      membershipTier: c.membershipTier, totalSpend: c.totalSpend,
      totalVisits: c.totalVisits, totalRewards: c.totalRewards
    },
    membership: membershipInfo(c)
  });
};

  if (!(key in DB.settings)) return err('INVALID_INPUT', 'Unknown setting. / 未知设置。');
  const oldValue = DB.settings[key];
  const value = String(data.value === undefined ? '' : data.value).trim();

  if (['POINTS_PER_RM', 'CLAIM_EXPIRY_HOURS', 'REWARD_MIN_SPEND', 'DAILY_REWARD_BUDGET',
       'MAX_WALLET_USAGE_PERCENT', 'MIN_WALLET_REDEEM_BILL', 'MEMBER_THRESHOLD',
       'SILVER_THRESHOLD', 'GOLD_THRESHOLD', 'LOW_REWARD_MODE_MAX'].indexOf(key) !== -1) {
    if (!isFinite(Number(value)) || Number(value) < 0) return err('INVALID_INPUT', 'Must be a number. / 必须是数字。');
  }
  if (key === 'REWARD_ENABLED' && ['TRUE', 'FALSE'].indexOf(value.toUpperCase()) === -1) {
    return err('INVALID_INPUT', 'Must be TRUE or FALSE.');
  }

  DB.settings[key] = value;
  audit(ctx.staff.staffId, 'STAFF', 'SETTINGS_CHANGE', 'SETTING', key, oldValue, value);
  save();
  return ok({ key: key, value: value });
};

handlers.getPromotionsAdmin = function (data, token) {

handlers.createPromotion = function (data, token) {
  const ctx = requireStaff(token, ['MANAGER', 'OWNER']);
  if (ctx.error) return ctx.error;

  const title = String(data.title || '').trim().slice(0, 80);
  if (!title) return err('INVALID_INPUT', 'Title required. / 请填写标题。');

  const p = promoObj(DB, title,
    String(data.subtitle || '').slice(0, 80),
    String(data.description || '').slice(0, 500),
    String(data.startDate || '').slice(0, 10),
    String(data.endDate || '').slice(0, 10));
  p.status = String(data.status || 'ACTIVE') === 'INACTIVE' ? 'INACTIVE' : 'ACTIVE';
  DB.promotions.push(p);
  audit(ctx.staff.staffId, 'STAFF', 'CREATE_PROMOTION', 'PROMOTION', p.promotionId, '', title);
  save();
  return ok({ promotion: p });
};

handlers.updatePromotion = function (data, token) {
  const ctx = requireStaff(token, ['MANAGER', 'OWNER']);
  if (ctx.error) return ctx.error;

  const p = DB.promotions.find(x => x.promotionId === String(data.promotionId || ''));
  if (!p) return err('INVALID_INPUT', 'Promotion not found. / 找不到活动。');

  const old = p.status;
  if (data.status !== undefined) p.status = String(data.status) === 'INACTIVE' ? 'INACTIVE' : 'ACTIVE';
  if (data.title !== undefined) p.title = String(data.title).slice(0, 80);
  if (data.subtitle !== undefined) p.subtitle = String(data.subtitle).slice(0, 80);
  if (data.description !== undefined) p.description = String(data.description).slice(0, 500);
  if (data.startDate !== undefined) p.startDate = String(data.startDate).slice(0, 10);
  if (data.endDate !== undefined) p.endDate = String(data.endDate).slice(0, 10);

  audit(ctx.staff.staffId, 'STAFF', 'UPDATE_PROMOTION', 'PROMOTION', p.promotionId, old, p.status);
  save();
  return ok({ promotion: p });
};

handlers.getAuditLogs = function (data, token) {
  const ctx = requireStaff(token, ['MANAGER', 'OWNER']);
  if (ctx.error) return ctx.error;

  const limit = Math.min(500, Math.max(1, Number(data.limit) || 100));

handlers.listStaff = function (data, token) {
  const ctx = requireStaff(token, ['OWNER']);
  if (ctx.error) return ctx.error;
  return ok({
    staff: DB.staff.map(s => ({
      staffId: s.staffId, username: s.username, role: s.role,

    }))
  });
};

handlers.createStaff = function (data, token) {
  const ctx = requireStaff(token, ['OWNER']);
  if (ctx.error) return ctx.error;

  const username = String(data.username || '').trim().toLowerCase();
  const password = String(data.password || '');
  const role = String(data.role || 'STAFF').toUpperCase();

  if (username.length < 3) return err('INVALID_INPUT', 'Username too short. / 账号太短。');
  if (password.length < 8) return err('INVALID_INPUT', 'Password min 8 chars. / 密码至少 8 位。');
  if (['OWNER', 'MANAGER', 'STAFF'].indexOf(role) === -1) return err('INVALID_ROLE');
  if (DB.staff.some(s => s.username.toLowerCase() === username)) return err('USERNAME_TAKEN');

  const salt = randomToken(8);
  const s = {
    staffId: 'STF' + pad(++DB.seq.staff, 4),
    username: username,
    salt: salt,
    passwordHash: hashPassword(password, salt),
    role: role,
    status: 'ACTIVE',
    lastLogin: '',
    createdAt: nowISO()
  };
  DB.staff.push(s);
  audit(ctx.staff.staffId, 'STAFF', 'CREATE_STAFF', 'STAFF', s.staffId, '', username + '/' + role);
  save();
  return ok({ staffId: s.staffId, username: s.username, role: s.role });
};

handlers.setStaffStatus = function (data, token) {
  const ctx = requireStaff(token, ['OWNER']);
  if (ctx.error) return ctx.error;
  const s = DB.staff.find(x => x.staffId === String(data.staffId || ''));
  if (!s) return err('STAFF_NOT_FOUND');
  if (s.role === 'OWNER' && s.staffId === ctx.staff.staffId) {
    return err('INVALID_INPUT', 'You cannot disable your own owner account. / 不能停用自己的老板账号。');
  }
  const old = s.status;
  s.status = String(data.status) === 'DISABLED' ? 'DISABLED' : 'ACTIVE';
  if (s.status === 'DISABLED') {
    DB.sessions.filter(x => x.userId === s.staffId && x.status === 'ACTIVE')
               .forEach(x => { x.status = 'LOGGED_OUT'; });
  }
  audit(ctx.staff.staffId, 'STAFF', 'UPDATE_STAFF', 'STAFF', s.staffId, old, s.status);
  save();
  return ok({ staffId: s.staffId, status: s.status });
};

handlers.resetStaffPassword = function (data, token) {
  const ctx = requireStaff(token, ['OWNER']);
  if (ctx.error) return ctx.error;
  const s = DB.staff.find(x => x.staffId === String(data.staffId || ''));
  if (!s) return err('STAFF_NOT_FOUND');
  const password = String(data.password || '');
  if (password.length < 8) return err('INVALID_INPUT', 'Password min 8 chars. / 密码至少 8 位。');
  s.salt = randomToken(8);
  s.passwordHash = hashPassword(password, s.salt);
  audit(ctx.staff.staffId, 'STAFF', 'RESET_PASSWORD', 'STAFF', s.staffId, '', '');
  save();
  return ok({ staffId: s.staffId });
};

/* =============================================================================
   9. Dispatcher
   ============================================================================= */

function handleRequest(payload) {
  const action = String(payload.action || '');
  const data = payload.data || {};
  const token = payload.token || '';

  const fn = handlers[action];
  if (!fn) return err('UNKNOWN_ACTION', 'Unknown action: ' + action);

  try {
    return fn(data, token) || ok({});
  } catch (e) {
    console.error('[demo] handler error', action, e);
    return fail('INTERNAL_ERROR', 'Internal error: ' + (e.message || 'unknown'));
  }
}



  /* ------------------------------------------------------------------
     储存：优先写到 localStorage，让「同一浏览器的所有页面」
     共用同一份演示资料（否则每换一页就等于换一台服务器）。
     没有 localStorage 的环境（例如被沙盒的预览）自动退回记忆体。
     ------------------------------------------------------------------ */
  var STORE_KEY = 'yetipsy_mock_db_v1';

  load = function () {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.v === 1 && parsed.data) { DB = parsed.data; return; }
      }
    } catch (e) { /* 退回记忆体 */ }
    DB = seed();
    save();
  };

  save = function () {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ v: 1, data: DB })); } catch (e) {}
  };

  load();

  return {
    handleRequest: handleRequest,
    reset: function () { DB = seed(); save(); },
    stats: function () {
      return {
        customers: DB.customers.length,
        orders: DB.orders.length,
        claims: DB.claims.length,
        rewards: DB.rewards.length
      };
    }
  };
})();

</script>
