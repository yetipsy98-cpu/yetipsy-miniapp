  "wallet.html": "<div class=\"page\">\n\n  <div class=\"row-between\" style=\"padding: 6px 2px 14px;\">\n    <a href=\"index.html\" style=\"color:var(--muted)\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg>\n    </a>\n    <div class=\"brand-mark\" style=\"font-size:17px;letter-spacing:5px;text-indent:5px;\">YETIPSY</div>\n    <div style=\"width:20px\"></div>\n  </div>\n\n  <div class=\"wallet-card\">\n    <div class=\"wallet-label\">My Wallet 我的钱包</div>\n    <div class=\"wallet-value\" id=\"r4_walletValue\">RM 0.00</div>\n    <div class=\"wallet-hint\">真实余额 · 可在下次消费抵扣<br>Real balance · can be used on your next visit.</div>\n  </div>\n\n  <div class=\"card mt-12\">\n    <div class=\"bilingual-zh\">如何使用</div>\n    <div class=\"bilingual-en\">HOW TO USE</div>\n    <div class=\"divider\"></div>\n    <div class=\"small muted\" style=\"line-height:1.8\">\n      1. 向店员出示这个页面<br>\n      <span class=\"tiny muted-2\">Show this page to our staff.</span><br><br>\n      2. 店员输入你的账单金额<br>\n      <span class=\"tiny muted-2\">Staff enters your bill amount.</span><br><br>\n      3. 系统计算可抵扣上限并确认<br>\n      <span class=\"tiny muted-2\">System calculates the max usable amount.</span><br><br>\n      4. 完成抵扣<br>\n      <span class=\"tiny muted-2\">Redemption completed.</span>\n    </div>\n    <div class=\"divider\"></div>\n    <div class=\"tiny muted-2\">\n      为保障账户安全，钱包抵扣必须由店员确认，会员无法自行扣除余额。<br>\n      For security, wallet redemption must be confirmed by staff.\n    </div>\n  </div>\n\n  <div class=\"section mt-16\">\n    <div class=\"section-title\">\n      <span class=\"st-zh\">钱包记录</span><span class=\"st-en\">WALLET HISTORY</span>\n    </div>\n    <div id=\"r4_walletHistory\">\n      <div class=\"skeleton\" style=\"height:60px;margin-bottom:8px\"></div>\n      <div class=\"skeleton\" style=\"height:60px\"></div>\n    </div>\n  </div>\n\n  <div class=\"footnote\">YETIPSY MINI APP 1.1 · FOODCOURT EDITION</div>\n</div>",
  "activity.html": "<div class=\"page\">\n\n  <div class=\"row-between\" style=\"padding: 6px 2px 14px;\">\n    <a href=\"index.html\" style=\"color:var(--muted)\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg>\n    </a>\n    <div class=\"brand-mark\" style=\"font-size:17px;letter-spacing:5px;text-indent:5px;\">YETIPSY</div>\n    <div style=\"width:20px\"></div>\n  </div>\n\n  <div class=\"section-title\">\n    <span class=\"st-zh\">我的记录</span><span class=\"st-en\">MY ACTIVITY</span>\n  </div>\n\n  <div class=\"tabs\" id=\"r5_tabs\">\n    <button class=\"tab active\" data-tab=\"orders\">消费 VISITS</button>\n    <button class=\"tab\" data-tab=\"points\">积分 POINTS</button>\n    <button class=\"tab\" data-tab=\"wallet\">钱包 WALLET</button>\n  </div>\n\n  <div id=\"r5_listBox\" class=\"mt-12\">\n    <div class=\"skeleton\" style=\"height:64px;margin-bottom:8px\"></div>\n    <div class=\"skeleton\" style=\"height:64px;margin-bottom:8px\"></div>\n    <div class=\"skeleton\" style=\"height:64px\"></div>\n  </div>\n\n  <div class=\"footnote\">YETIPSY MINI APP 1.1 · FOODCOURT EDITION</div>\n</div>\n\n<style>\n.tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 13px; padding: 4px; }\n.tab {\n  flex: 1; min-height: 38px; border: none; background: transparent; color: var(--muted);\n  border-radius: 10px; font-size: 10.5px; letter-spacing: .8px; cursor: pointer;\n}\n.tab.active { background: var(--card-2); color: var(--gold); font-weight: 600; }\n</style>",
  "profile.html": "<div class=\"page\">\n\n  <div class=\"row-between\" style=\"padding: 6px 2px 14px;\">\n    <a href=\"index.html\" style=\"color:var(--muted)\">\n      <svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 5l-7 7 7 7\"/></svg>\n    </a>\n    <div class=\"brand-mark\" style=\"font-size:17px;letter-spacing:5px;text-indent:5px;\">YETIPSY</div>\n    <div style=\"width:20px\"></div>\n  </div>\n\n  <!-- MEMBER CARD -->\n  <div class=\"hero-card\">\n    <div class=\"hero-top\">\n      <div>\n        <div style=\"font-size:20px;font-weight:650\" id=\"r6_memberName\">—</div>\n        <div class=\"tiny muted-2 mt-8\" id=\"r6_memberId\">—</div>\n      </div>\n      <div id=\"r6_memberTier\"></div>\n    </div>\n\n    <div class=\"stat-grid mt-16\">\n      <div class=\"stat\" style=\"background:#141414\">\n        <div class=\"stat-label\">Points 积分</div>\n        <div class=\"stat-value gold\" id=\"r6_statPoints\">0</div>\n      </div>\n      <div class=\"stat\" style=\"background:#141414\">\n        <div class=\"stat-label\">Wallet 钱包</div>\n        <div class=\"stat-value\" id=\"r6_statWallet\">RM 0.00</div>\n      </div>\n      <div class=\"stat\" style=\"background:#141414\">\n        <div class=\"stat-label\">Total Spend 累计</div>\n        <div class=\"stat-value\" id=\"r6_statSpend\">RM 0.00</div>\n      </div>\n      <div class=\"stat\" style=\"background:#141414\">\n        <div class=\"stat-label\">Visits 到店</div>\n        <div class=\"stat-value\" id=\"r6_statVisits\">0</div>\n      </div>\n    </div>\n  </div>\n\n  <!-- EDIT PROFILE -->\n  <div class=\"section\">\n    <div class=\"section-title\">\n      <span class=\"st-zh\">会员资料</span><span class=\"st-en\">MY DETAILS</span>\n    </div>\n    <div class=\"card\">\n      <div class=\"field\">\n        <div class=\"label\"><span>名字</span><span class=\"l-en\">NAME</span></div>\n        <input id=\"r6_nameInput\" class=\"input\" type=\"text\" maxlength=\"40\" placeholder=\"Jason\">\n      </div>\n      <div class=\"field\">\n        <div class=\"label\">\n          <span>生日（可不填 · 未来生日奖励用）</span>\n          <span class=\"l-en\">BIRTHDAY — OPTIONAL</span>\n        </div>\n        <input id=\"r6_birthdayInput\" class=\"input\" type=\"date\">\n      </div>\n      <div class=\"field\">\n        <div class=\"label\"><span>手机号码</span><span class=\"l-en\">MOBILE</span></div>\n        <input id=\"r6_phoneInput\" class=\"input\" type=\"text\" disabled>\n      </div>\n      <button id=\"r6_saveBtn\" class=\"btn btn-primary\">\n        <span>保存资料<span class=\"btn-sub-label\">SAVE</span></span>\n      </button>\n    </div>\n  </div>\n\n  <!-- PRIVACY -->\n  <div class=\"section\">\n    <div class=\"section-title\">\n      <span class=\"st-zh\">隐私说明</span><span class=\"st-en\">PRIVACY</span>\n    </div>\n    <div class=\"card\">\n      <div class=\"small muted\" style=\"line-height:1.8\">\n        Yetipsy 只收集会员系统必要的资料：手机号码、名字（可不填）、生日（可不填）\n        以及你的消费记录。这些资料只用于：\n        <br><br>\n        · 会员身份识别 Membership identity<br>\n        · 积分累计 Points<br>\n        · 奖励发放 Rewards<br>\n        · 消费记录 Transaction history<br>\n        · 优惠通知 Promotions\n        <br><br>\n        我们不会因为会员系统收集不必要的个人资料。\n      </div>\n    </div>\n  </div>\n\n  <button id=\"r6_logoutBtn\" class=\"btn btn-danger\">\n    <span>登出<span class=\"btn-sub-label\">LOG OUT</span></span>\n  </button>\n\n  <div class=\"center mt-16\">\n    <a href=\"admin/login.html\" class=\"tiny muted-2\" style=\"letter-spacing:1.4px\">STAFF LOGIN 员工登录</a>\n  </div>\n\n  <div class=\"footnote\">YETIPSY MINI APP 1.1 · FOODCOURT EDITION</div>\n</div>",
  "admin/login.html": "<div class=\"login-wrap\">\n  <div class=\"login-logo\">\n    <div class=\"ll-mark\">YETIPSY</div>\n    <div class=\"ll-sub\">staff · admin</div>\n  </div>\n\n  <div style=\"height: 34px\"></div>\n\n  <div id=\"r7_demoBanner\"></div>\n\n  <div class=\"a-field\">\n    <label class=\"a-label\">Username 账号</label>\n    <input id=\"r7_usernameInput\" class=\"a-input\" type=\"text\" autocomplete=\"username\"\n           autocapitalize=\"none\" spellcheck=\"false\" placeholder=\"owner\">\n  </div>\n\n  <div class=\"a-field\">\n    <label class=\"a-label\">Password 密码</label>\n    <input id=\"r7_passwordInput\" class=\"a-input\" type=\"password\" autocomplete=\"current-password\" placeholder=\"••••••••\">\n  </div>\n\n  <button id=\"r7_loginBtn\" class=\"btn btn-primary\" style=\"min-height:52px\">\n    SIGN IN 登录\n  </button>\n\n  <div class=\"center mt-16\">\n    <a href=\"../index.html\" class=\"tiny muted-2\">BACK TO CUSTOMER APP 返回会员端</a>\n  </div>\n\n  <div class=\"footnote\">YETIPSY MINI APP 1.1 · FOODCOURT EDITION</div>\n</div>",
  "admin/index.html": "<div class=\"a-page\">\n\n  <div class=\"row-between\" style=\"margin-bottom:14px\">\n    <div>\n      <div class=\"tiny muted-2\" style=\"letter-spacing:2px\" id=\"r8_todayLabel\">TONIGHT</div>\n      <div style=\"font-size:15px;font-weight:650\" id=\"r8_dateLabel\">—</div>\n    </div>\n    <button id=\"r8_logoutBtn\" class=\"btn btn-ghost btn-sm\" style=\"width:auto;padding:0 14px\">SIGN OUT</button>\n  </div>\n\n  <a class=\"big-action\" href=\"claim.html\">\n    + CREATE CLAIM\n    <span class=\"ba-sub\">建立认领 · 5 秒完成</span>\n  </a>\n\n  <div class=\"a-section-title\">Tonight 今晚</div>\n\n  <div class=\"dash-grid\">\n    <div class=\"dash-card wide\">\n      <div class=\"dc-label\">Member Sales 会员消费</div>\n      <div class=\"dc-value gold\" id=\"r8_statMemberSales\">RM 0.00</div>\n      <div class=\"dc-sub\" id=\"r8_statSalesSub\">All recorded sales: RM 0.00</div>\n    </div>\n\n    <div class=\"dash-card\">\n      <div class=\"dc-label\">Claims 认领</div>\n      <div class=\"dc-value\" id=\"r8_statClaims\">0</div>\n      <div class=\"dc-sub\" id=\"r8_statClaimsSub\">0 pending</div>\n    </div>\n\n    <div class=\"dash-card\">\n      <div class=\"dc-label\">New Members 新会员</div>\n      <div class=\"dc-value\" id=\"r8_statNewMembers\">0</div>\n      <div class=\"dc-sub\">registered today</div>\n    </div>\n\n    <div class=\"dash-card\">\n      <div class=\"dc-label\">Points Issued 发出积分</div>\n      <div class=\"dc-value\" id=\"r8_statPoints\">0</div>\n    </div>\n\n    <div class=\"dash-card\">\n      <div class=\"dc-label\">Rewards 奖励</div>\n      <div class=\"dc-value\" id=\"r8_statRewards\">RM 0.00</div>\n      <div class=\"dc-sub\" id=\"r8_statRewardsSub\">budget RM 50.00</div>\n    </div>\n\n    <div class=\"dash-card wide\">\n      <div class=\"dc-label\">Wallet Redeemed 钱包抵扣</div>\n      <div class=\"dc-value\" id=\"r8_statWalletRedeemed\">RM 0.00</div>\n    </div>\n  </div>\n\n  <div class=\"a-section-title\">Recent Claims 最近认领</div>\n  <div id=\"r8_recentClaims\">\n    <div class=\"skeleton\" style=\"height:56px;margin-bottom:8px\"></div>\n    <div class=\"skeleton\" style=\"height:56px\"></div>\n  </div>\n\n  <div class=\"center mt-16\">\n    <a href=\"orders.html\" class=\"tiny muted-2\" style=\"letter-spacing:1.4px\">VIEW ALL ORDERS 查看全部订单</a>\n  </div>\n\n</div>",
  "admin/claim.html": "<div class=\"a-page\">\n\n  <!-- ========== FORM ========== -->\n  <div id=\"r9_viewForm\">\n\n    <div class=\"a-field\">\n      <label class=\"a-label\">Source 来源</label>\n      <div class=\"seg\" id=\"r9_sourceSeg\">\n        <button class=\"active\" data-source=\"FOODCOURT\">FOODCOURT<br><span class=\"tiny\">食阁</span></button>\n        <button data-source=\"DIRECT\">DIRECT<br><span class=\"tiny\">直接</span></button>\n        <button data-source=\"MANUAL\">MANUAL<br><span class=\"tiny\">手动</span></button>\n      </div>\n    </div>\n\n    <div class=\"a-field\">\n      <label class=\"a-label\">Order No. 订单号码</label>\n      <input id=\"r9_orderNoInput\" class=\"a-input\" type=\"text\" autocomplete=\"off\"\n             autocapitalize=\"characters\" placeholder=\"FC8231\" maxlength=\"30\">\n      <div class=\"a-note mt-8\" id=\"r9_orderNoHint\">输入 Foodcourt 订单号码 · Enter the Foodcourt order number</div>\n    </div>\n\n    <div class=\"a-field\">\n      <label class=\"a-label\">Amount 金额</label>\n      <div class=\"amount-wrap\">\n        <span class=\"currency\">RM</span>\n        <input id=\"r9_amountInput\" class=\"a-input huge\" type=\"text\" inputmode=\"decimal\"\n               autocomplete=\"off\" placeholder=\"0.00\">\n      </div>\n    </div>\n\n    <button id=\"r9_createBtn\" class=\"btn btn-primary\" style=\"min-height:54px\">\n      CREATE CLAIM 建立认领\n    </button>\n  </div>\n\n  <!-- ========== RESULT ========== -->\n  <div id=\"r9_viewResult\" style=\"display:none\">\n\n    <div class=\"card center\" style=\"border-color:rgba(229,183,105,.35);background:linear-gradient(180deg,#1E1B15,#151412)\">\n      <div class=\"tiny muted-2\" style=\"letter-spacing:2.4px\">CLAIM READY</div>\n      <div style=\"font-size:38px;font-weight:750;color:var(--a-gold);margin-top:8px\" id=\"r9_resAmount\">RM 0.00</div>\n      <div class=\"a-sub mt-8\" id=\"r9_resOrder\">—</div>\n\n      <div class=\"qr-box mt-16\">\n        <div id=\"r9_qrContainer\"></div>\n      </div>\n\n      <div class=\"center mt-12\">\n        <div class=\"tiny muted-2\" style=\"letter-spacing:2px\">SCAN TO CLAIM</div>\n        <div class=\"tiny muted-2\" style=\"letter-spacing:1.6px;margin-top:6px\">or 或</div>\n        <div style=\"font-size:34px;font-weight:750;letter-spacing:8px;margin-top:6px;color:var(--a-gold)\" id=\"r9_resCode\">Y7K2</div>\n        <div class=\"tiny muted-2\" style=\"margin-top:6px\">CODE</div>\n      </div>\n\n      <div class=\"tiny muted-2 mt-12\" id=\"r9_resExpiry\">—</div>\n    </div>\n\n    <div class=\"btn-row mt-12\">\n      <button id=\"r9_copyBtn\" class=\"btn btn-secondary btn-sm\">COPY CODE</button>\n      <button id=\"r9_cancelBtn\" class=\"btn btn-danger btn-sm\">CANCEL</button>\n    </div>\n\n    <button id=\"r9_newClaimBtn\" class=\"btn btn-primary mt-8\">\n      + NEW CLAIM 下一笔\n    </button>\n\n    <div class=\"a-note center mt-12\">\n      把 QR 或 Code 给顾客 · 顾客回家后仍可认领<br>\n      Give the QR or code to the customer.\n    </div>\n  </div>\n\n  <!-- ========== RECENT ========== -->\n  <div class=\"a-section-title\">Recent Claims 最近建立</div>\n  <div id=\"r9_recentList\"><div class=\"a-empty\">Loading…</div></div>\n\n</div>",

var ROUTER = (function () {

  var currentRoute = null;

  function isSingleFile() { return true; }

  function current() { return currentRoute || 'index.html'; }

  function search() {
    var q = current().indexOf('?');
    return q === -1 ? '' : current().slice(q);
  }

  function normalize(url) {
    var raw = String(url || 'index.html');
    var isParent = /^\.\.\//.test(raw);          // ../index.html = 回到会员端
    var isAbsolute = raw.charAt(0) === '/';            // /claim.html = 会员端
    url = raw.replace(/^\.\.\//, '').replace(/^\.\//, '');
    if (url.charAt(0) === '/') url = url.slice(1);
    // 相对路径：在 admin 页面里的 index.html = admin/index.html
    if (!isParent && !isAbsolute && !/^admin\//.test(url) && /^admin\//.test(current() || '')) {
      url = 'admin/' + url;
    }
    return url || 'index.html';
  }

  function go(url) {
    url = normalize(url);
    var newHash = '#/' + url;
    if (location.hash !== newHash) location.hash = newHash;
    if (currentRoute !== url) render(url, true);   // 只渲染一次
  }

  function render(url, alreadyNormalized) {
    if (!alreadyNormalized) url = normalize(url);
    var route = url.split('?')[0];
    if (!PAGE_TEMPLATES[route]) route = 'index.html';
    currentRoute = url;

    // 清掉上一个页面留下的 header / nav
    ['.app-header', '.admin-header', '.bottom-nav', '.admin-nav'].forEach(function (sel) {
      Array.prototype.slice.call(document.querySelectorAll(sel)).forEach(function (n) {
        if (n.parentNode) n.parentNode.removeChild(n);
      });
    });
    document.body.classList.remove('has-header', 'has-bottom-nav', 'has-admin-nav');

    // body class（admin 页面使用深色管理端样式）
    var bc = PAGE_BODY_CLASS[route] || '';
    document.body.classList.toggle('admin', /admin/.test(bc));

    // 每次都以干净的 DOM 重新渲染，避免重复的 event listener
    var container = document.getElementById('routeContainer');
    var section = document.createElement('section');
    section.className = 'route active';
    section.setAttribute('data-route', route);
    section.innerHTML = PAGE_TEMPLATES[route];
    container.innerHTML = '';
    container.appendChild(section);

    // 执行该页面的初始化程式
    if (ROUTES[route]) {
      try { ROUTES[route](); }
      catch (e) {
        if (window.console) console.error('route init error [' + route + ']: ' + (e && e.stack ? e.stack : e));
      }
    }

    try { window.scrollTo(0, 0); } catch (e) { /* 某些内嵌预览环境不支援 */ }
  }

  /** 拦截站内连结，改成内部切换 */
  function bindLinks() {
    document.addEventListener('click', function (e) {
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a) return;
      var href = a.getAttribute('href') || '';
      if (!href || href.charAt(0) === '#' || /^https?:|mailto:|tel:/i.test(href)) return;
      if (!/\.html(\?|$)/.test(href)) return;
      e.preventDefault();
      go(href);
    }, true);
  }

  /** 把真实网址转成内部路由（GitHub Pages 子目录站台也适用）
   *    /                          → index.html
   *    /claim.html?token=abc      → claim.html?token=abc
   *    /admin/login.html          → admin/login.html
   */
  function fromLocation() {
    var parts = (location.pathname || '/').split('/').filter(Boolean);
    var route = 'index.html';
    if (parts.length) {
      var last = parts[parts.length - 1];
      var prev = parts.length > 1 ? parts[parts.length - 2] : '';
      if (/^admin$/i.test(last)) route = 'admin/index.html';
      else if (/^admin$/i.test(prev)) route = 'admin/' + last;
      else if (/\.html$/i.test(last)) route = last;
    }
    if (location.search) route += location.search;   // 关键：保留 ?token=xxx
    return route;
  }

  function start() {
    bindLinks();

    document.getElementById('offlineBadge').addEventListener('dblclick', function () {
      MOCK_BACKEND.reset();
      AUTH.clearCustomer();
      AUTH.clearStaff();
      location.hash = '#/index.html';
      render('index.html');
      if (window.UI) UI.toast('演示资料已重置 / Demo data reset', 'success');
    });

    window.addEventListener('hashchange', function () {
      // 支援浏览器上一页 / 下一页；若已渲染过相同页面则略过
      var h = (location.hash || '').replace(/^#\/?/, '');
      var u = normalize(h || 'index.html');
      if (u !== currentRoute) render(u, true);
    });

    var fromHash = (location.hash || '').replace(/^#\/?/, '');
    var initial = fromHash || fromLocation();
    render(initial);
    // 让网址也能分享（加上 hash，不会重新载入页面）
    var wantHash = '#/' + currentRoute;
    if (location.hash !== wantHash) {
      try { history.replaceState(null, '', wantHash); } catch (e) { location.hash = wantHash; }
    }
  }

  return {
    isSingleFile: isSingleFile,
    current: current,
    search: search,
    go: go,
    render: render,
    start: start,
    fromLocation: fromLocation
  };
})();

        var username = u.value.trim();
        var password = p.value;
        if (!username || !password) {
          UI.toast('Enter username and password / 请输入账号密码', 'error');
          return;
        }
        UI.setLoading(btn, true, 'SIGNING IN');
        API.staff.login(username, password).then(function (res) {
          UI.setLoading(btn, false);
          if (!res.success) {
            UI.toast(res.error.message, 'error');
            return;
          }
          AUTH.setStaffSession(res.data.token, res.data.staff);
          UI.go('index.html');
        });
      }
    
      btn.addEventListener('click', submit);
      p.addEventListener('keydown', function (e) { if (e.key === 'Enter') submit(); });
      u.addEventListener('keydown', function (e) { if (e.key === 'Enter') p.focus(); });
      u.focus();
    })();
    
  },
  "admin/index.html": function () {
    
      if (ADMIN.requireAuth()) {
        ADMIN.renderShell({ title: '' });
        ADMIN_DASH.init();
      }
    
  },
  "admin/claim.html": function () {
    
      if (ADMIN.requireAuth()) {
        ADMIN.renderShell({ title: 'CREATE CLAIM' });
        ADMIN_CLAIM.init();
      }
    
  },
  "admin/customers.html": function () {
    
      if (ADMIN.requireAuth()) {
        ADMIN.renderShell({ title: 'MEMBERS' });
        ADMIN_CUSTOMER.init();
      }
    
  },
  "admin/orders.html": function () {
    
      if (ADMIN.requireAuth()) {
        ADMIN.renderShell({ title: 'ORDERS' });
        ADMIN_ORDERS.init();
      }
    
  },
  "admin/settings.html": function () {
    
      if (ADMIN.requireManager()) {
        ADMIN.renderShell({ title: 'SETTINGS' });
        ADMIN_SETTINGS.init();
      }
    
  },
  "admin/audit.html": function () {
    
      if (ADMIN.requireManager()) {
        ADMIN.renderShell({ title: 'AUDIT LOGS' });
        ADMIN_AUDIT.init();
      }
    
  },
  "admin/staff.html": function () {
    
      if (ADMIN.requireAuth()) {
        if (!ADMIN.isOwner()) {
          document.body.innerHTML =
            '<div class="a-page"><div class="a-empty">OWNER ONLY<br>只有老板可以管理员工账号</div>' +
            '<div class="center mt-16"><a href="index.html" class="tiny muted-2">BACK 返回</a></div></div>';
          ADMIN.renderShell({ title: 'STAFF' });
        } else {
          ADMIN.renderShell({ title: 'STAFF ACCOUNTS' });
          ADMIN_STAFF.init();
        }
      }
    
  },
  "admin/more.html": function () {
    
    (function () {
      if (!ADMIN.requireAuth()) return;
      ADMIN.renderShell({ title: 'MORE' });
    
      var s = AUTH.getStaffProfile() || {};
      document.getElementById('r15_staffRole').textContent  = s.role || '';
      document.getElementById('r15_staffName').textContent  = s.name || s.username || '';
      document.getElementById('r15_staffUser').textContent  = '@' + (s.username || '');
    
      document.getElementById('r15_logoutBtn').addEventListener('click', ADMIN.logout);
    })();
    
  }
};

ROUTER.start();
</script>
