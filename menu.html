<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YETIPSY — Menu 酒单</title>
<meta name="description" content="YETIPSY menu. Choose, add to cart, checkout — all on one page.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css?v=2.1.13">
</head>
<body>

<div class="page menu-page">

  <div class="menu-top">
    <a href="index.html" class="icon-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <div class="brand-mark" style="font-size:16px;letter-spacing:5px;text-indent:5px;">YETIPSY</div>
    <button class="icon-btn" id="topCartBtn" aria-label="Cart">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1.2 12.2a1.8 1.8 0 0 1-1.8 1.6H9a1.8 1.8 0 0 1-1.8-1.6Z"/><path d="M9 7V5.5A3 3 0 0 1 12 3a3 3 0 0 1 3 2.5V7"/></svg>
      <span class="icon-badge" id="topCartBadge" style="display:none">0</span>
    </button>
  </div>

  <div class="menu-search">
    <input class="input" id="menuSearch" type="search" autocomplete="off"
           placeholder="Search cocktails... 搜寻鸡尾酒">
  </div>

  <div class="cat-strip" id="catStrip"></div>
  <div class="tag-strip" id="tagStrip"></div>

  <div id="orderingBanner"></div>

  <div class="tiny muted" id="menuHint" style="padding: 0 2px 10px;"></div>

  <div id="menuList"></div>

</div>

<!-- ============ 底部购物车条（一直在，不用跳页） ============ -->
<div class="cart-bar" id="cartBar" style="display:none">
  <button class="cb-main" id="cbOpenCart">
    <span class="cb-count" id="cbCount">0</span>
    <span class="cb-text">已选 <span class="cb-total" id="cbTotal">RM 0.00</span></span>
  </button>
  <button class="cb-go" id="cbCheckout">结帐 CHECKOUT</button>
</div>

<!-- ============ 规格 / 购物车：都是同一页的浮层 ============ -->
<div class="sheet-overlay" id="sheetOverlay" style="display:none">

  <!-- ① 规格选择 -->
  <div class="sheet" id="productSheet" style="display:none">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-head-text">
        <div class="sheet-title" id="sheetTitle">—</div>
        <div class="sheet-sub" id="sheetSub"></div>
      </div>
      <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot">
      <div class="qty-ctrl">
        <button class="qty-btn" id="sheetQtyMinus">−</button>
        <span class="qty-value" id="sheetQtyValue">1</span>
        <button class="qty-btn" id="sheetQtyPlus">+</button>
      </div>
      <button class="btn btn-primary sheet-add" id="sheetAddBtn">加入购物车 ADD</button>
    </div>
  </div>

  <!-- ② 购物车 drawer -->
  <div class="sheet" id="cartSheet" style="display:none">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <div class="sheet-head-text">
        <div class="sheet-title">购物车 <span class="tiny muted-2">CART</span></div>
        <div class="sheet-sub" id="cartSheetSub">—</div>
      </div>
      <button class="sheet-close" id="cartSheetClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="cartSheetBody"></div>
    <div class="sheet-foot">
      <button class="btn btn-ghost sheet-clear" id="cartClearBtn">清空</button>
      <button class="btn btn-primary sheet-add" id="cartSheetGo">去结帐 CHECKOUT</button>
    </div>
  </div>

</div>

<!-- ============ 结帐小抽屉（不换页，金额已经预载好） ============ -->
<div class="sheet" id="checkoutSheet" style="display:none">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-label="结帐 CHECKOUT">
    <div class="sheet-head">
      <div class="sheet-titles">
        <div class="bilingual-zh" style="font-size:17px">确认订单</div>
        <div class="bilingual-en">CONFIRM ORDER</div>
        <div class="tiny" style="color:var(--gold);margin-top:3px" id="sheetSubtitle"></div>
      </div>
      <button class="sheet-close" id="sheetCloseBtn" aria-label="关闭 CLOSE">✕</button>
    </div>
    <div class="sheet-body" id="checkoutBody"></div>
    <div class="sheet-foot" id="sheetCta">
      <button class="btn btn-primary" id="placeOrderBtn" disabled><span>PLACE ORDER</span></button>
    </div>
  </div>
</div>

<script src="js/config.js?v=2.1.13"></script>
<script src="js/api.js?v=2.1.13"></script>
<script src="js/auth.js?v=2.1.13"></script>
<script src="js/ui.js?v=2.1.13"></script>
<script src="js/cart.js?v=2.1.13"></script>
<script src="js/checkout.js?v=2.1.13"></script>
<script src="js/menu.js?v=2.1.13"></script>
<script>
  MENU.init();
</script>

<script>
/* PWA：註冊 Service Worker（只 Cache App Shell，不 Cache 任何敏感资料） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
