<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YETIPSY — Join the night</title>
<meta name="description" content="YETIPSY membership, points, rewards and wallet.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="page home-page">

  <!-- 顶栏：品牌 · 连线状态 · 认领（右上角保留） -->
  <div class="row-between" style="padding: 6px 2px 14px;">
    <div class="brand-mark" style="font-size:19px;letter-spacing:6px;text-indent:6px;">YETIPSY</div>
    <div class="row-between" style="gap:10px;align-items:center">
      <div id="connectionStatus" class="tiny muted-2" style="letter-spacing:1.4px"></div>
      <a href="claim.html" class="top-claim" id="topClaimLink">
        <span id="claimIcon"></span>
        <span class="tc-zh">认领</span><span class="tc-en">CLAIM</span>
      </a>
    </div>
  </div>

  <!-- 活动幕布：活动 / 待领奖励轮流播放，可左右滑动 -->
  <div class="home-banner" id="homeBanner">
    <div class="hb-track" id="homeBannerTrack">
      <div class="hb-slide hb-default">
        <div class="hb-zh">YETIPSY</div>
        <div class="hb-en">JOIN THE NIGHT</div>
      </div>
    </div>
    <div class="hb-dots" id="homeBannerDots"></div>
  </div>

  <!-- 只有 API_URL 没配置时才会出现（正式环境不会显示） -->
  <div id="configError"></div>

  <!-- 四个入口：下面没有别的选项 -->
  <div class="home-grid">
    <a class="home-tile" href="menu.html">
      <span class="ht-icon" id="tileMenu"></span>
      <span class="ht-zh">下单</span><span class="ht-en">ORDER</span>
    </a>
    <a class="home-tile" href="code.html">
      <span class="ht-icon" id="tileCode"></span>
      <span class="ht-zh">会员码</span><span class="ht-en">MEMBER CODE</span>
    </a>
    <a class="home-tile" href="profile.html">
      <span class="ht-icon" id="tileProfile"></span>
      <span class="ht-zh">会员中心</span><span class="ht-en">MEMBER</span>
    </a>
    <a class="home-tile" href="orders.html">
      <span class="ht-icon" id="tileOrders"></span>
      <span class="ht-zh">我的订单</span><span class="ht-en">MY ORDERS</span>
    </a>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  APP.init();
</script>

<script>
/* PWA：註冊 Service Worker（只 Cache App Shell，不 Cache 任何敏感资料） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
