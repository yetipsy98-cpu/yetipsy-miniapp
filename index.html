<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>YETIPSY — Join the night</title>
<meta name="description" content="YETIPSY membership, points, rewards and wallet.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="page">

  <div class="row-between" style="padding: 6px 2px 14px;">
    <div>
      <div class="brand-mark" style="font-size:19px;letter-spacing:6px;text-indent:6px;">YETIPSY</div>
    </div>
    <div id="connectionStatus" class="tiny muted-2" style="letter-spacing:1.4px"></div>
  </div>

  <!-- 只有 DEMO 模式（API_URL 没填）才会出现；正式环境不会显示 -->
  <div id="demoBanner"></div>

  <!-- HERO / MEMBERSHIP -->
  <div class="hero-card" id="heroCard">
    <div class="hero-top">
      <div class="hero-greet" id="greeting">—</div>
      <div id="tierBadge"></div>
    </div>
    <div class="hero-points">
      <div class="hero-points-value" id="pointsValue">0</div>
      <div class="hero-points-unit">POINTS<br>积分</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressText">—</span>
        <span id="progressNext">—</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stat-grid">
    <div class="stat">
      <div class="stat-label">My Wallet 我的钱包</div>
      <div class="stat-value gold" id="walletValue">RM 0.00</div>
      <div class="stat-sub" id="walletSub">可在下次消费抵扣</div>
    </div>
    <div class="stat">
      <div class="stat-label">Total Spend 累计消费</div>
      <div class="stat-value" id="spendValue">RM 0.00</div>
      <div class="stat-sub" id="visitsSub">0 visits 到店</div>
    </div>
  </div>

  <!-- CLAIM CTA -->
  <div class="section" style="margin-top:16px">
    <a class="cta-claim" href="claim.html">
      <div class="cta-row">
        <div>
          <div class="cta-main">认领消费</div>
          <div class="cta-sub">CLAIM PURCHASE</div>
        </div>
        <div style="color:var(--gold)" id="claimIcon"></div>
      </div>
    </a>
  </div>

  <!-- PENDING REWARD -->
  <div id="pendingRewardBox"></div>

  <!-- QUICK -->
  <div class="section">
    <div class="quick-grid">
      <a class="quick-item" href="claim.html">
        <span class="qi-icon" id="qiScan"></span>
        <span class="qi-zh">扫码</span><span class="qi-en">SCAN</span>
      </a>
      <a class="quick-item" href="activity.html">
        <span class="qi-icon" id="qiAct"></span>
        <span class="qi-zh">记录</span><span class="qi-en">ACTIVITY</span>
      </a>
      <a class="quick-item" href="wallet.html">
        <span class="qi-icon" id="qiWallet"></span>
        <span class="qi-zh">钱包</span><span class="qi-en">WALLET</span>
      </a>
      <a class="quick-item" href="profile.html">
        <span class="qi-icon" id="qiProfile"></span>
        <span class="qi-zh">会员</span><span class="qi-en">MEMBER</span>
      </a>
    </div>
  </div>

  <!-- TONIGHT / PROMOTIONS -->
  <div class="section">
    <div class="section-title">
      <span class="st-zh">今晚活动</span><span class="st-en">TONIGHT</span>
    </div>
    <div id="promoList">
      <div class="skeleton" style="height:80px"></div>
    </div>
  </div>

  <div class="footnote">YETIPSY MINI APP 1.4 · FOODCOURT EDITION</div>
  <div class="footnote mt-8">
    <a href="admin/login.html" class="tiny muted-2" style="letter-spacing:1.4px">STAFF LOGIN 员工登录</a>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script>
  UI.renderBottomNav('index.html');
  APP.init();
</script>

<script>
/* PWA：註冊 Service Worker（只 Cache App Shell，不 Cache 任何敏感资料） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
